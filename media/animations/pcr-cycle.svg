<svg class="pc-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="pc-t pc-d">
  <title id="pc-t">Анимация: один цикл ПЦР — денатурация, отжиг, элонгация</title>
  <desc id="pc-d">Двойная спираль ДНК разделяется на две цепи при нагревании (денатурация). Праймеры находят и связываются со своими участками на каждой цепи (отжиг). Термостабильная полимераза удлиняет праймеры, синтезируя новые цепи (элонгация). Цикл повторяется, и число копий удваивается.</desc>
  <style>
    .pc-svg text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; font-size: 12.5px; }
    .pc-svg .pc-b { font-weight: 700; }
    .pc-svg .pc-m { fill: #5b6577; }
    .pc-svg .pc-w { fill: #fff; font-weight: 700; text-anchor: middle; font-size: 10.5px; }
    .pc-svg .pc-cap { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .pc-svg .pc-dna { stroke: #2f3f7a; stroke-width: 5; fill: none; stroke-linecap: round; }
    .pc-svg .pc-top { animation: pc-top 14s ease-in-out infinite; transform-origin: 360px 180px; }
    .pc-svg .pc-bot { animation: pc-bot 14s ease-in-out infinite; transform-origin: 360px 180px; }
    .pc-svg .pc-fprimer { animation: pc-fp 14s linear infinite; }
    .pc-svg .pc-rprimer { animation: pc-rp 14s linear infinite; }
    .pc-svg .pc-fext { animation: pc-fext 14s linear infinite; }
    .pc-svg .pc-rext { animation: pc-rext-x 14s linear infinite, pc-rext-w 14s linear infinite; }
    .pc-svg .pc-poly1 { animation: pc-poly1 14s linear infinite; }
    .pc-svg .pc-poly2 { animation: pc-poly2 14s linear infinite; }
    .pc-svg .pc-scene { animation: pc-scene 14s linear infinite; }
    .pc-svg .pc-c1 { animation: pc-c1 14s linear infinite; } .pc-svg .pc-c2 { animation: pc-c2 14s linear infinite; }
    .pc-svg .pc-c3 { animation: pc-c3 14s linear infinite; }
    @keyframes pc-scene { 0% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0; } 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes pc-top { 0%, 4% { transform: translateY(0); } 24%, 100% { transform: translateY(-46px); } }
    @keyframes pc-bot { 0%, 4% { transform: translateY(0); } 24%, 100% { transform: translateY(46px); } }
    @keyframes pc-fp { 0%, 30% { opacity: 0; } 36%, 100% { opacity: 1; } }
    @keyframes pc-rp { 0%, 34% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes pc-poly1 { 0%, 46% { opacity: 0; transform: translateX(0); } 50% { opacity: 1; transform: translateX(0); } 70%, 100% { opacity: 1; transform: translateX(230px); } }
    @keyframes pc-poly2 { 0%, 50% { opacity: 0; transform: translateX(0); } 54% { opacity: 1; transform: translateX(0); } 74%, 100% { opacity: 1; transform: translateX(-230px); } }
    @keyframes pc-fext { 0%, 50% { width: 0; } 74%, 100% { width: 230px; } }
    @keyframes pc-rext-x { 0%, 54% { x: 530px; } 78%, 100% { x: 300px; } }
    @keyframes pc-rext-w { 0%, 54% { width: 0; } 78%, 100% { width: 230px; } }
    @keyframes pc-c1 { 0%, 1% { opacity: 0; } 3%, 22% { opacity: 1; } 26%, 100% { opacity: 0; } }
    @keyframes pc-c2 { 0%, 27% { opacity: 0; } 30%, 44% { opacity: 1; } 48%, 100% { opacity: 0; } }
    @keyframes pc-c3 { 0%, 49% { opacity: 0; } 52%, 82% { opacity: 1; } 86%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pc-svg * { animation-play-state: paused; } }
  </style>
  <rect width="720" height="420" fill="#ffffff"/>
  <text class="pc-m" x="20" y="30" style="font-size:13px">Один цикл ПЦР: три температурных шага удваивают число копий фрагмента.</text>

  <g class="pc-scene">
    <g class="pc-top"><line class="pc-dna" x1="130" y1="180" x2="590" y2="180"/></g>
    <g class="pc-bot"><line class="pc-dna" x1="130" y1="180" x2="590" y2="180" style="stroke:#7fa6d9"/></g>

    <g class="pc-fprimer"><line x1="150" y1="180" x2="190" y2="180" stroke="#ee8a2b" stroke-width="6"/></g>
    <g class="pc-rprimer"><line x1="570" y1="180" x2="530" y2="180" style="stroke:#3fa34d" stroke-width="6"/></g>

    <g class="pc-poly1"><ellipse cx="205" cy="180" rx="20" ry="14" fill="#7b5ea7"/><text class="pc-w" x="205" y="184">Taq</text></g>
    <g class="pc-poly2"><ellipse cx="515" cy="180" rx="20" ry="14" fill="#7b5ea7"/><text class="pc-w" x="515" y="184">Taq</text></g>
    <rect class="pc-fext" x="190" y="176" width="0" height="8" fill="#c0392b"/>
    <rect class="pc-rext" x="530" y="176" width="0" height="8" fill="#c0392b"/>
  </g>

  <text class="pc-cap pc-c1" x="360" y="380">1. Денатурация: спираль разделяется на две цепи</text>
  <text class="pc-cap pc-c2" x="360" y="380">2. Отжиг: праймеры находят свои участки</text>
  <text class="pc-cap pc-c3" x="360" y="380">3. Элонгация: Taq-полимераза достраивает новые цепи</text>
</svg>
