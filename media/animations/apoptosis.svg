<svg class="ap-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="ap-t ap-d">
  <title id="ap-t">Анимация: внутренний путь апоптоза и действие венетоклакса</title>
  <desc id="ap-d">В опухолевой клетке BCL2 удерживает BIM. Венетоклакс занимает белок BCL2, BIM освобождается и активирует BAX, который образует поры в мембране митохондрии. Из митохондрии выходит цитохром c, образуется апоптосома, активируются каспазы, клетка сморщивается и распадается на апоптотические тельца.</desc>
  <style>
    .ap-svg text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; font-size: 12.5px; }
    .ap-svg .ap-w { fill: #fff; font-weight: 700; text-anchor: middle; font-size: 11px; }
    .ap-svg .ap-m { fill: #5b6577; }
    .ap-svg .ap-cap { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .ap-svg .ap-ven { animation: ap-ven 18s ease-in-out infinite; }
    .ap-svg .ap-bim { animation: ap-bim 18s ease-in-out infinite; }
    .ap-svg .ap-bax { animation: ap-bax 18s linear infinite; }
    .ap-svg .ap-pore { animation: ap-pore 18s linear infinite; }
    .ap-svg .ap-cyt { animation: ap-cyt 18s ease-in-out infinite; }
    .ap-svg .ap-apo { animation: ap-apo 18s linear infinite; }
    .ap-svg .ap-cell { animation: ap-cell 18s ease-in-out infinite; transform-origin: 360px 300px; }
    .ap-svg .ap-scene { animation: ap-scene 18s linear infinite; }
    .ap-svg .ap-c1 { animation: ap-c1 18s linear infinite; } .ap-svg .ap-c2 { animation: ap-c2 18s linear infinite; }
    .ap-svg .ap-c3 { animation: ap-c3 18s linear infinite; } .ap-svg .ap-c4 { animation: ap-c4 18s linear infinite; } .ap-svg .ap-c5 { animation: ap-c5 18s linear infinite; }
    @keyframes ap-scene { 0% { opacity: 1; } 94% { opacity: 1; } 98% { opacity: 0; } 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes ap-ven { 0%, 20% { opacity: 0; transform: translate(80px,-60px); } 28%, 100% { opacity: 1; transform: translate(0,0); } }
    @keyframes ap-bim { 0%, 30% { transform: translate(0,0); } 40%, 100% { transform: translate(90px, 60px); } }
    @keyframes ap-bax { 0%, 42% { opacity: 0; } 48%, 100% { opacity: 1; } }
    @keyframes ap-pore { 0%, 52% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes ap-cyt { 0%, 56% { opacity: 0; transform: translateY(0); } 62% { opacity: 1; transform: translateY(0); } 74%, 100% { opacity: 1; transform: translateY(70px); } }
    @keyframes ap-apo { 0%, 72% { opacity: 0; } 78%, 100% { opacity: 1; } }
    @keyframes ap-cell { 0%, 80% { transform: scale(1); } 92%, 100% { transform: scale(0.82); } }
    @keyframes ap-c1 { 0%, 1% { opacity: 0; } 3%, 22% { opacity: 1; } 26%, 100% { opacity: 0; } }
    @keyframes ap-c2 { 0%, 26% { opacity: 0; } 29%, 42% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes ap-c3 { 0%, 46% { opacity: 0; } 49%, 58% { opacity: 1; } 61%, 100% { opacity: 0; } }
    @keyframes ap-c4 { 0%, 61% { opacity: 0; } 64%, 76% { opacity: 1; } 79%, 100% { opacity: 0; } }
    @keyframes ap-c5 { 0%, 80% { opacity: 0; } 83%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ap-svg * { animation-play-state: paused; } }
  </style>
  <rect width="720" height="460" fill="#ffffff"/>
  <g class="ap-scene">
    <g class="ap-cell"><ellipse cx="360" cy="270" rx="300" ry="150" fill="#fdf6ee" stroke="#e0b98a" stroke-width="3"/></g>
    <text class="ap-m" x="76" y="160" style="font-size:11.5px">опухолевая клетка (зависима от BCL2)</text>
    <!-- митохондрия -->
    <ellipse cx="360" cy="300" rx="110" ry="52" fill="#f4d6c0" stroke="#b4531a" stroke-width="2"/>
    <path d="M290 300 q20 -30 40 0 t40 0 t40 0" fill="none" stroke="#b4531a" stroke-width="2"/>
    <text class="ap-m" x="360" y="356" text-anchor="middle" style="font-size:11.5px">митохондрия</text>
    <!-- BCL2 + BIM -->
    <ellipse cx="240" cy="222" rx="54" ry="24" fill="#3b6fd4"/><text class="ap-w" x="240" y="226" style="font-size:13px">BCL2</text>
    <g class="ap-bim"><ellipse cx="300" cy="210" rx="30" ry="14" fill="#e0a43a"/><text class="ap-w" x="300" y="214" style="fill:#1c2330;font-size:10.5px">BIM</text></g>
    <g class="ap-ven"><rect x="196" y="176" width="88" height="20" rx="10" fill="#c0392b"/><text class="ap-w" x="240" y="190" style="font-size:10px">венетоклакс</text></g>
    <!-- BAX и пора -->
    <g class="ap-bax"><ellipse cx="416" cy="248" rx="38" ry="16" fill="#3fa34d"/><text class="ap-w" x="416" y="252" style="font-size:10.5px">BAX</text></g>
    <g class="ap-pore"><ellipse cx="416" cy="256" rx="22" ry="7" fill="#fff" stroke="#3fa34d" stroke-width="2.5"/></g>
    <g class="ap-cyt"><circle cx="404" cy="292" r="7" fill="#c0392b"/><circle cx="420" cy="298" r="7" fill="#c0392b"/><circle cx="412" cy="310" r="7" fill="#c0392b"/><text class="ap-m" x="440" y="296" style="font-size:11px;fill:#c0392b">цитохром c</text></g>
    <g class="ap-apo"><ellipse cx="500" cy="380" rx="100" ry="20" fill="#7b5ea7"/><text class="ap-w" x="500" y="384" style="font-size:10.5px">апоптосома → каспазы</text></g>
  </g>
  <text class="ap-cap ap-c1" x="360" y="30">1. BCL2 удерживает BIM: клетка «живёт» за счёт BCL2</text>
  <text class="ap-cap ap-c2" x="360" y="30">2. Венетоклакс занимает BH3-борозду BCL2</text>
  <text class="ap-cap ap-c3" x="360" y="30">3. BIM освобождён и активирует BAX</text>
  <text class="ap-cap ap-c4" x="360" y="30">4. Поры в митохондрии — выходит цитохром c</text>
  <text class="ap-cap ap-c5" x="360" y="30">5. Апоптосома, каспазы — клетка сморщивается и гибнет</text>
</svg>
