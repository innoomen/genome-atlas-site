<svg class="el-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="el-t el-d">
  <title id="el-t">Анимация: как энхансер включает далёкий ген</title>
  <desc id="el-d">На энхансер садятся транскрипционные факторы. Когезин выдавливает петлю ДНК между двумя границами CTCF, и энхансер сближается с промотором. Комплекс Mediator помогает собрать РНК-полимеразу II, и ген синтезирует РНК всплесками. Затем петля распадается.</desc>
  <style>
    .el-svg text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; font-size: 12.5px; }
    .el-svg .el-b { font-weight: 700; }
    .el-svg .el-m { fill: #5b6577; }
    .el-svg .el-dna { stroke: #2f3f7a; stroke-width: 6; fill: none; stroke-linecap: round; }
    .el-svg .el-loop { stroke: #8b93c9; stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 100; }
    .el-svg .el-cap { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .el-svg .el-scene { animation: el-scene 14s linear infinite; }
    .el-svg .el-tf { animation: el-tf 14s linear infinite; }
    .el-svg .el-coh { animation: el-coh 14s linear infinite; }
    .el-svg .el-loopanim { animation: el-loop 14s ease-in-out infinite; }
    .el-svg .el-med { animation: el-med 14s linear infinite; }
    .el-svg .el-pol { animation: el-pol 14s linear infinite; }
    .el-svg .el-r1 { animation: el-r 14s linear infinite; }
    .el-svg .el-r2 { animation: el-r 14s linear infinite; animation-delay: .9s; }
    .el-svg .el-r3 { animation: el-r 14s linear infinite; animation-delay: 1.8s; }
    .el-svg .el-c1 { animation: el-c1 14s linear infinite; } .el-svg .el-c2 { animation: el-c2 14s linear infinite; }
    .el-svg .el-c3 { animation: el-c3 14s linear infinite; } .el-svg .el-c4 { animation: el-c4 14s linear infinite; }
    @keyframes el-scene { 0% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0; } 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes el-tf { 0%, 3% { opacity: 0; transform: translateY(-14px); } 8%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes el-coh { 0%, 14% { opacity: 0; } 18%, 100% { opacity: 1; } }
    @keyframes el-loop { 0%, 18% { stroke-dashoffset: 100; } 42%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    @keyframes el-med { 0%, 42% { opacity: 0; } 47%, 100% { opacity: 1; } }
    @keyframes el-pol { 0%, 48% { opacity: 0; } 53%, 100% { opacity: 1; } }
    @keyframes el-r { 0%, 55% { opacity: 0; transform: translateX(0); } 56% { opacity: 1; transform: translateX(0); } 68% { opacity: 0; transform: translateX(110px); } 100% { opacity: 0; transform: translateX(110px); } }
    @keyframes el-c1 { 0%, 1% { opacity: 0; } 3%, 14% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes el-c2 { 0%, 15% { opacity: 0; } 18%, 40% { opacity: 1; } 43%, 100% { opacity: 0; } }
    @keyframes el-c3 { 0%, 43% { opacity: 0; } 46%, 55% { opacity: 1; } 57%, 100% { opacity: 0; } }
    @keyframes el-c4 { 0%, 56% { opacity: 0; } 59%, 86% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .el-svg * { animation-play-state: paused; } }
  </style>
  <rect width="720" height="420" fill="#ffffff"/>
  <g class="el-scene">
    <!-- ДНК -->
    <line class="el-dna" x1="20" y1="300" x2="700" y2="300"/>
    <rect x="96" y="290" width="46" height="20" rx="4" fill="#f0b429"/><text class="el-b" x="119" y="330" text-anchor="middle" style="fill:#b4531a;font-size:12px">энхансер</text>
    <polygon points="212,286 232,300 212,314" fill="#1f4e8c"/><polygon points="508,286 488,300 508,314" fill="#1f4e8c"/><text class="el-b" x="222" y="338" text-anchor="middle" style="fill:#1f4e8c;font-size:12px">CTCF</text><text class="el-b" x="498" y="338" text-anchor="middle" style="fill:#1f4e8c;font-size:12px">CTCF</text>
    <rect x="560" y="290" width="40" height="20" rx="4" fill="#ee8a2b"/><rect x="600" y="286" width="60" height="28" fill="#2e6f95"/><text class="el-b" x="600" y="338" text-anchor="middle" style="fill:#2e6f95;font-size:12px">ген (промотор + экзоны)</text>
    <!-- ТФ -->
    <g class="el-tf">
      <ellipse cx="108" cy="262" rx="16" ry="12" fill="#d1432f"/><ellipse cx="130" cy="256" rx="16" ry="12" fill="#3b6fd4"/><ellipse cx="119" cy="238" rx="15" ry="11" fill="#3fa34d"/>
      <text class="el-m" x="160" y="236" style="font-size:11.5px">транскрипционные</text><text class="el-m" x="160" y="250" style="font-size:11.5px">факторы</text>
    </g>
    <!-- петля -->
    <path class="el-loop el-loopanim" pathLength="100" d="M130 296 C130 110 580 110 580 296"/>
    <ellipse class="el-coh" cx="360" cy="250" rx="44" ry="17" fill="none" stroke="#c0397b" stroke-width="5"/>
    <text class="el-coh el-b" x="360" y="282" text-anchor="middle" style="fill:#c0397b;font-size:11.5px">когезин</text>
    <!-- Mediator + Pol II -->
    <g class="el-med"><rect x="315" y="126" width="90" height="30" rx="12" fill="#7b5ea7"/><text class="el-b" x="360" y="146" text-anchor="middle" style="fill:#fff;font-size:12.5px">Mediator</text></g>
    <g class="el-pol"><ellipse cx="585" cy="268" rx="30" ry="18" fill="#6c7a96"/><text class="el-b" x="585" y="272" text-anchor="middle" style="fill:#fff;font-size:11px">Pol II</text></g>
    <circle class="el-r1" cx="604" cy="252" r="5" fill="#ee8a2b"/><circle class="el-r2" cx="604" cy="252" r="5" fill="#ee8a2b"/><circle class="el-r3" cx="604" cy="252" r="5" fill="#ee8a2b"/>
  </g>
  <text class="el-cap el-c1" x="360" y="390">1. Транскрипционные факторы садятся на энхансер</text>
  <text class="el-cap el-c2" x="360" y="390">2. Когезин выдавливает петлю между границами CTCF</text>
  <text class="el-cap el-c3" x="360" y="390">3. Энхансер сближается с промотором; Mediator собирает Pol II</text>
  <text class="el-cap el-c4" x="360" y="390">4. Ген «вспыхивает»: РНК синтезируется всплесками</text>
  <text class="el-m" x="20" y="30" style="font-size:13px">Энхансер может находиться за десятки тысяч пар оснований от гена, но действует через петлю.</text>
</svg>
