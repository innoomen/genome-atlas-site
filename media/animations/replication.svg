<svg class="rep-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="rep-t rep-d">
  <title id="rep-t">Анимация: репликационный пузырь и две репликативные вилки</title>
  <desc id="rep-d">От точки начала репликации расходятся две вилки. Геликаза движется по родительской ДНК и расплетает её. Одноцепочечную ДНК покрывает белок RPA. Впереди вилки топоизомераза снимает суперскручивание. На лидирующей цепи ДНК-полимераза строит новую цепь непрерывно, на отстающей праймаза ставит РНК-праймеры, а полимераза строит фрагменты Окадзаки, которые затем сшивает лигаза.</desc>
  <style>
    .rep-svg text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; font-size: 12.5px; }
    .rep-svg .rep-h { font-weight: 700; }
    .rep-svg .rep-mut { fill: #5b6577; }
    .rep-svg .rep-old { stroke: #2f3f7a; stroke-width: 6; fill: none; }
    .rep-svg .rep-new { stroke: #ee8a2b; stroke-width: 6; fill: none; }
    .rep-svg .rep-primer { stroke: #b4531a; stroke-width: 6; }
    .rep-svg .rep-rung { stroke: #c3cad8; stroke-width: 2; }
    .rep-svg .rep-hel { fill: #2e86ab; stroke: #fff; stroke-width: 2; }
    .rep-svg .rep-rpa { fill: #3fa34d; stroke: #fff; stroke-width: 1.5; }
    .rep-svg .rep-pol { fill: #6c7a96; stroke: #fff; stroke-width: 2; }
    .rep-svg .rep-pola { fill: #7b5ea7; stroke: #fff; stroke-width: 2; }
    .rep-svg .rep-topo { fill: none; stroke: #c0397b; stroke-width: 6; }
    .rep-svg .rep-wave { fill: none; stroke: #2f3f7a; stroke-width: 3.5; stroke-linecap: round; }
    .rep-svg .rep-lig { fill: #1d7a46; stroke: #fff; stroke-width: 1.5; }
    .rep-svg .rep-dash { stroke-dasharray: 100; }
    .rep-svg .rep-ldr { stroke: #8a94a8; stroke-width: 1.4; fill: none; }

    .rep-svg .rep-scene { animation: rep-scene 12s linear infinite; }
    .rep-svg .rep-bub { transform-origin: 290px 200px; animation: rep-bub 12s linear infinite; }
    .rep-svg .rep-lead { transform-origin: 290px 174px; animation: rep-lead 12s linear infinite; }
    .rep-svg .rep-fork { animation: rep-fork 12s linear infinite; }
    .rep-svg .rep-cover { transform-origin: 344px 200px; animation: rep-cover 12s linear infinite; }
    .rep-svg .rep-wavegrp { transform-origin: 428px 200px; animation: rep-wave 3.6s ease-in-out infinite; }
    .rep-svg .rep-ring { transform-box: fill-box; transform-origin: center; animation: rep-ring 3.6s ease-in-out infinite; }
    .rep-svg .rep-helpulse { transform-box: fill-box; transform-origin: center; animation: rep-helpulse 1.4s ease-in-out infinite; }
    .rep-svg .rep-lig { transform-box: fill-box; transform-origin: center; }

    @keyframes rep-scene { 0% { opacity: 1; } 91% { opacity: 1; } 96% { opacity: 0; } 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes rep-bub { 0% { transform: scaleX(1); } 85%, 100% { transform: scaleX(8.917); } }
    @keyframes rep-lead { 0% { transform: scaleX(1); } 85%, 100% { transform: scaleX(11.56); } }
    @keyframes rep-fork { 0% { transform: translateX(0); } 85%, 100% { transform: translateX(190px); } }
    @keyframes rep-cover { 0% { transform: scaleX(0.03); } 85%, 100% { transform: scaleX(1); } }
    @keyframes rep-wave { 0% { transform: scaleY(0.3); } 58% { transform: scaleY(1); } 72% { transform: scaleY(1); } 92%, 100% { transform: scaleY(0.3); } }
    @keyframes rep-ring { 0%, 58% { transform: scale(1); } 65% { transform: scale(1.35); } 76%, 100% { transform: scale(1); } }
    @keyframes rep-helpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .rep-svg .rep-f1 { animation: rep-f1 12s linear infinite; }
    .rep-svg .rep-p1 { animation: rep-p1 12s linear infinite; }
    .rep-svg .rep-q1 { animation: rep-q1 12s linear infinite; }
    @keyframes rep-f1 { 0%, 17% { stroke-dashoffset: 100; } 30%, 100% { stroke-dashoffset: 0; } }
    @keyframes rep-p1 { 0%, 16.9% { opacity: 0; } 17%, 100% { opacity: 1; } }
    @keyframes rep-q1 { 0%, 16.9% { transform: translateX(0); opacity: 0; } 17% { transform: translateX(0); opacity: 1; } 30% { transform: translateX(-34px); opacity: 1; } 31%, 100% { transform: translateX(-34px); opacity: 0; } }
    .rep-svg .rep-f2 { animation: rep-f2 12s linear infinite; }
    .rep-svg .rep-p2 { animation: rep-p2 12s linear infinite; }
    .rep-svg .rep-q2 { animation: rep-q2 12s linear infinite; }
    @keyframes rep-f2 { 0%, 34% { stroke-dashoffset: 100; } 47%, 100% { stroke-dashoffset: 0; } }
    @keyframes rep-p2 { 0%, 33.9% { opacity: 0; } 34%, 100% { opacity: 1; } }
    @keyframes rep-q2 { 0%, 33.9% { transform: translateX(0); opacity: 0; } 34% { transform: translateX(0); opacity: 1; } 47% { transform: translateX(-34px); opacity: 1; } 48%, 100% { transform: translateX(-34px); opacity: 0; } }
    .rep-svg .rep-f3 { animation: rep-f3 12s linear infinite; }
    .rep-svg .rep-p3 { animation: rep-p3 12s linear infinite; }
    .rep-svg .rep-q3 { animation: rep-q3 12s linear infinite; }
    @keyframes rep-f3 { 0%, 51% { stroke-dashoffset: 100; } 64%, 100% { stroke-dashoffset: 0; } }
    @keyframes rep-p3 { 0%, 50.9% { opacity: 0; } 51%, 100% { opacity: 1; } }
    @keyframes rep-q3 { 0%, 50.9% { transform: translateX(0); opacity: 0; } 51% { transform: translateX(0); opacity: 1; } 64% { transform: translateX(-34px); opacity: 1; } 65%, 100% { transform: translateX(-34px); opacity: 0; } }
    .rep-svg .rep-f4 { animation: rep-f4 12s linear infinite; }
    .rep-svg .rep-p4 { animation: rep-p4 12s linear infinite; }
    .rep-svg .rep-q4 { animation: rep-q4 12s linear infinite; }
    @keyframes rep-f4 { 0%, 68% { stroke-dashoffset: 100; } 81%, 100% { stroke-dashoffset: 0; } }
    @keyframes rep-p4 { 0%, 67.9% { opacity: 0; } 68%, 100% { opacity: 1; } }
    @keyframes rep-q4 { 0%, 67.9% { transform: translateX(0); opacity: 0; } 68% { transform: translateX(0); opacity: 1; } 81% { transform: translateX(-34px); opacity: 1; } 82%, 100% { transform: translateX(-34px); opacity: 0; } }
    .rep-svg .rep-l1 { animation: rep-l1 12s linear infinite; }
    @keyframes rep-l1 { 0%, 47.9% { opacity: 0; transform: scale(0); } 48% { opacity: 1; transform: scale(1.5); } 51%, 100% { opacity: 1; transform: scale(1); } }
    .rep-svg .rep-l2 { animation: rep-l2 12s linear infinite; }
    @keyframes rep-l2 { 0%, 64.9% { opacity: 0; transform: scale(0); } 65% { opacity: 1; transform: scale(1.5); } 68%, 100% { opacity: 1; transform: scale(1); } }
    .rep-svg .rep-l3 { animation: rep-l3 12s linear infinite; }
    @keyframes rep-l3 { 0%, 81.9% { opacity: 0; transform: scale(0); } 82% { opacity: 1; transform: scale(1.5); } 85%, 100% { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) { .rep-svg * { animation-play-state: paused; } }
  </style>
