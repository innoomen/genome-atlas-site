      <path class="rep-ldr" d="M356 214 L372 248"/><text class="rep-h" x="376" y="262">геликаза</text>
      <path class="rep-ldr" d="M326 240 L316 262"/><text class="rep-h" x="312" y="276" text-anchor="end">RPA: покрывает оцДНК</text>
