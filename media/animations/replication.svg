    <circle class="rep-pol" cx="7" cy="24" r="8"/><text x="24" y="28">ДНК-полимеразы</text>
    <circle class="rep-pola" cx="152" cy="24" r="8"/><text x="166" y="28">праймаза–Pol α</text>
    <circle class="rep-lig" cx="286" cy="24" r="6"/><text x="298" y="28">лигаза сшивает фрагменты</text>
  </g>
</svg>
