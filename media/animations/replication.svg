  <!-- статические подписи -->
  <text class="rep-mut" x="280" y="104" text-anchor="end">отстающая цепь: фрагменты Окадзаки</text>
  <text class="rep-mut" x="300" y="104">лидирующая цепь: непрерывно</text>
  <text class="rep-mut" x="280" y="352" text-anchor="end">лидирующая цепь: непрерывно</text>
  <text class="rep-mut" x="300" y="352">отстающая цепь: фрагменты Окадзаки</text>
  <text class="rep-mut" x="20" y="34" style="font-size:13px">Две вилки движутся в противоположные стороны от точки начала репликации (ori).</text>

  <!-- легенда -->
