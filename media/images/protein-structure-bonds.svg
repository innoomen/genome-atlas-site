<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d">
  <title id="t">Уровни структуры белка и связи, которые её удерживают</title>
  <desc id="d">Первичная структура — последовательность аминокислот, соединённых пептидными связями. Вторичная — альфа-спираль и бета-складчатость, удерживаемые водородными связями остова. Третичная — пространственная укладка одной цепи: гидрофобные взаимодействия, дисульфидные мостики между цистеинами, ионные и водородные связи. Четвертичная — комплекс нескольких субъединиц (например, гемоглобин из четырёх цепей с гемами).</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #5b6577; }
    .w { font-size: 10px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .ln { stroke: #8a94a8; stroke-width: 1.6; fill: none; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text class="h" x="20" y="28">От цепи аминокислот к работающему белку</text>
  <line x1="222" y1="48" x2="222" y2="356" stroke="#e1e6ee" stroke-width="2" stroke-dasharray="6 6"/><line x1="444" y1="48" x2="444" y2="356" stroke="#e1e6ee" stroke-width="2" stroke-dasharray="6 6"/><line x1="666" y1="48" x2="666" y2="356" stroke="#e1e6ee" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 1 -->
  <text class="b" x="20" y="60" style="fill:#4b4f9e">1° Первичная</text><text class="s" x="20" y="76">последовательность аа</text>
  <g>
    <circle cx="40" cy="130" r="15" fill="#f0b429"/><text class="w" x="40" y="134" style="fill:#1c2330">Met</text>
    <circle cx="90" cy="150" r="15" fill="#3fa34d"/><text class="w" x="90" y="154">Ala</text>
    <circle cx="140" cy="130" r="15" fill="#3b6fd4"/><text class="w" x="140" y="134">Lys</text>
    <circle cx="190" cy="150" r="15" fill="#e4572e"/><text class="w" x="190" y="154">Glu</text>
    <path d="M55 132 L75 148 M105 148 L125 132 M155 132 L175 148" stroke="#c0392b" stroke-width="3.5" fill="none"/>
  </g>
  <text class="s" x="22" y="106" style="font-size:11.5px">N-конец</text><text class="s" x="190" y="186" text-anchor="middle" style="font-size:11.5px">C-конец</text>
  <text class="b" x="112" y="216" text-anchor="middle" style="fill:#c0392b;font-size:12px">пептидная связь</text><text class="s" x="112" y="232" text-anchor="middle" style="font-size:11.5px">ковалентная, C–N</text>
  <text class="s" x="20" y="262" style="font-size:12px">Образуется на рибосоме; задаёт,</text><text class="s" x="20" y="278" style="font-size:12px">как цепь сложится дальше.</text>

  <!-- 2 -->
  <text class="b" x="242" y="60" style="fill:#4b4f9e">2° Вторичная</text><text class="s" x="242" y="76">α-спираль и β-складка</text>
  <path d="M250 160 c10 -34 20 -34 30 0 s20 34 30 0 s20 -34 30 0 s20 34 30 0 s20 -34 30 0" fill="none" stroke="#e4572e" stroke-width="7" stroke-linecap="round"/>
  <text class="s" x="316" y="118" text-anchor="middle" style="font-size:11.5px">α-спираль</text>
  <g>
    <polygon points="252,226 322,226 322,218 342,232 322,246 322,238 252,238" fill="#3b6fd4"/>
    <polygon points="342,254 272,254 272,246 252,260 272,274 272,266 342,266" fill="#3b6fd4"/>
    <path d="M280 238 v8 M300 238 v8 M320 238 v8" stroke="#ee8a2b" stroke-width="2.5" stroke-dasharray="2 2" fill="none"/>
  </g>
  <text class="s" x="316" y="294" text-anchor="middle" style="font-size:11.5px">β-складка (антипараллельная)</text>
  <text class="b" x="242" y="322" style="fill:#c7501f;font-size:12px">водородные связи остова</text><text class="s" x="242" y="338" style="font-size:11.5px">между C=O и N–H разных аа</text>

  <!-- 3 -->
  <text class="b" x="464" y="60" style="fill:#4b4f9e">3° Третичная</text><text class="s" x="464" y="76">укладка одной цепи</text>
  <path d="M480 240 C470 190 500 150 540 150 C600 146 640 176 630 226 C624 268 574 288 540 270 C512 258 520 226 546 220 C574 214 590 236 572 250" fill="none" stroke="#5b6577" stroke-width="7" stroke-linecap="round"/>
  <circle cx="512" cy="200" r="8" fill="#f0b429"/><circle cx="598" cy="262" r="8" fill="#f0b429"/>
  <path d="M512 206 C530 240 570 254 592 258" fill="none" stroke="#f0b429" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="548" cy="176" r="7" fill="#3b6fd4"/><circle cx="600" cy="196" r="7" fill="#e4572e"/>
  <path d="M554 178 L594 194" stroke="#8a94a8" stroke-width="2.5" stroke-dasharray="3 3" fill="none"/>
  <g>
    <circle cx="560" cy="222" r="22" fill="#fff1c7" stroke="#d9b64a" stroke-width="2"/><text class="s" x="560" y="226" text-anchor="middle" style="font-size:10.5px;fill:#1c2330">гидро-</text><text class="s" x="560" y="238" text-anchor="middle" style="font-size:10.5px;fill:#1c2330">фобное</text>
  </g>
  <path class="ln" d="M497 194 L470 130"/><text class="b" x="466" y="122" style="fill:#c0392b;font-size:11.5px">S–S мостик</text>
  <text class="s" x="464" y="300" style="font-size:11px">(между цистеинами — ковалентно)</text>
  <text class="s" x="464" y="316" style="font-size:11px">ионная связь «+»…«−» (серо-синие)</text>
  <text class="s" x="464" y="332" style="font-size:11px">гидрофобные остатки — внутрь</text>

  <!-- 4 -->
  <text class="b" x="686" y="60" style="fill:#4b4f9e">4° Четвертичная</text><text class="s" x="686" y="76">несколько субъединиц</text>
  <g>
    <circle cx="738" cy="140" r="34" fill="#f8d7d0" stroke="#e4572e" stroke-width="3"/><circle cx="806" cy="140" r="34" fill="#dbe9f5" stroke="#3b6fd4" stroke-width="3"/>
    <circle cx="738" cy="208" r="34" fill="#dbe9f5" stroke="#3b6fd4" stroke-width="3"/><circle cx="806" cy="208" r="34" fill="#f8d7d0" stroke="#e4572e" stroke-width="3"/>
    <text class="b" x="738" y="145" text-anchor="middle" style="font-size:12px">α</text><text class="b" x="806" y="145" text-anchor="middle" style="font-size:12px">β</text><text class="b" x="738" y="213" text-anchor="middle" style="font-size:12px">β</text><text class="b" x="806" y="213" text-anchor="middle" style="font-size:12px">α</text>
    <circle cx="726" cy="130" r="6" fill="#c0392b"/><circle cx="818" cy="130" r="6" fill="#c0392b"/><circle cx="726" cy="220" r="6" fill="#c0392b"/><circle cx="818" cy="220" r="6" fill="#c0392b"/>
  </g>
  <text class="b" x="772" y="270" text-anchor="middle" style="font-size:12px">гемоглобин α₂β₂</text>
  <text class="s" x="772" y="286" text-anchor="middle" style="font-size:11.5px">красные точки — гемы</text>
  <text class="s" x="686" y="316" style="font-size:11.5px">субъединицы держатся нековалентно</text><text class="s" x="686" y="332" style="font-size:11.5px">(гидрофобные, ионные, H-связи)</text>

  <!-- таблица связей -->
  <line x1="20" y1="372" x2="880" y2="372" stroke="#e1e6ee" stroke-width="2"/>
  <text class="h" x="20" y="400">Какие связи держат белок</text>
  <g font-size="12.5">
    <rect x="20" y="414" width="860" height="26" fill="#f0f3f8"/>
    <text class="b" x="30" y="432">Связь</text><text class="b" x="240" y="432">Между чем</text><text class="b" x="520" y="432">Прочность и роль</text>
    <text class="s" x="30" y="460" style="fill:#1c2330">Пептидная</text><text class="s" x="240" y="460">C одной аа и N следующей</text><text class="s" x="520" y="460">ковалентная; образует цепь (1°)</text>
    <text class="s" x="30" y="484" style="fill:#1c2330">Дисульфидная (S–S)</text><text class="s" x="240" y="484">два остатка цистеина</text><text class="s" x="520" y="484">ковалентная; в белках вне клетки (ЭПР)</text>
    <text class="s" x="30" y="508" style="fill:#1c2330">Водородная</text><text class="s" x="240" y="508">C=O и N–H (остов, боковые цепи)</text><text class="s" x="520" y="508">слабая, но многочисленная; 2° и 3°</text>
    <text class="s" x="30" y="532" style="fill:#1c2330">Ионная («солевой мостик»)</text><text class="s" x="240" y="532">«+» (Lys, Arg) и «−» (Asp, Glu)</text><text class="s" x="520" y="532">зависит от pH и соли; 3° и 4°</text>
    <text class="s" x="30" y="556" style="fill:#1c2330">Гидрофобное взаимодействие</text><text class="s" x="240" y="556">неполярные боковые цепи</text><text class="s" x="520" y="556">главная сила фолдинга: «ядро» внутри</text>
    <text class="s" x="30" y="580" style="fill:#1c2330">Ван-дер-ваальсовы</text><text class="s" x="240" y="580">любые близкие атомы</text><text class="s" x="520" y="580">очень слабые; плотная упаковка</text>
  </g>
  <text class="s" x="20" y="616" style="font-size:12px">Денатурация (нагрев, кислота, мочевина) разрушает нековалентные связи; пептидные связи при этом остаются.</text>
</svg>
