<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Механизм редактирования CRISPR-Cas9</title>
  <desc id="d">Комплекс Cas9 с направляющей РНК находит PAM рядом с целевым участком ДНК, направляющая РНК спаривается с одной из цепей, Cas9 вносит двухцепочечный разрыв. Дальше клетка чинит разрыв одним из двух путей: NHEJ — быстрое неточное соединение концов со случайными инделами и нокаутом гена, или HDR — точная правка по донорской матрице.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #5b6577; }
    .w { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .dna { stroke: #2f3f7a; stroke-width: 5; fill: none; stroke-linecap: round; }
    .box { fill: #f5f7fb; stroke: #b7c0cf; stroke-width: 1.6; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text class="h" x="20" y="28">1. Комплекс Cas9 + направляющая РНК находит мишень</text>

  <line class="dna" x1="60" y1="90" x2="840" y2="90"/>
  <line class="dna" x1="60" y1="110" x2="840" y2="110"/>
  <rect x="700" y="82" width="46" height="16" rx="3" fill="#e0a43a"/><text class="w" x="723" y="94">PAM</text>
  <path d="M320 90 C320 60 660 60 660 90" fill="none" stroke="#ee8a2b" stroke-width="4" stroke-dasharray="3 4"/>
  <text class="s" x="490" y="54" text-anchor="middle">направляющая РНК спаривается с целевой цепью</text>

  <ellipse cx="600" cy="100" rx="80" ry="46" fill="#dbe4f2" stroke="#3b6fd4" stroke-width="2.5" opacity="0.9"/>
  <text class="b" x="600" y="104" text-anchor="middle" style="fill:#3b6fd4">Cas9</text>
  <path d="M600 100 v42" stroke="#c0392b" stroke-width="4"/>
  <text class="s" x="540" y="160">двухцепочечный разрыв рядом с PAM</text>

  <line x1="20" y1="196" x2="880" y2="196" stroke="#e1e6ee" stroke-width="2"/>
  <text class="h" x="20" y="224">2. Клетка чинит разрыв: два пути</text>

  <!-- NHEJ -->
  <rect class="box" x="40" y="248" width="380" height="300" rx="12"/>
  <text class="b" x="56" y="274" style="fill:#c0392b">NHEJ — быстро, но неточно</text>
  <line class="dna" x1="70" y1="320" x2="230" y2="320"/>
  <line class="dna" x1="250" y1="320" x2="410" y2="320"/>
  <path d="M230 306 l20 14 -20 14" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text class="s" x="70" y="350">разорванные концы сшиваются напрямую,</text>
  <text class="s" x="70" y="366">без образца для копирования</text>
  <line class="dna" x1="70" y1="404" x2="200" y2="404"/>
  <rect x="200" y="396" width="18" height="16" rx="3" fill="#c0392b"/>
  <line class="dna" x1="218" y1="404" x2="410" y2="404"/>
  <text class="s" x="70" y="432">случайная вставка/потеря нуклеотидов (индел)</text>
  <text class="s" x="70" y="448">→ часто сдвиг рамки считывания</text>
  <text class="b" x="70" y="490" style="fill:#c0392b">Результат: нокаут гена</text>
  <text class="s" x="70" y="510">ген перестаёт производить рабочий белок</text>
  <text class="s" x="70" y="530">работает почти во всех типах клеток</text>

  <!-- HDR -->
  <rect class="box" x="480" y="248" width="380" height="300" rx="12" style="fill:#eef8f0;stroke:#9ed0a8"/>
  <text class="b" x="496" y="274" style="fill:#2f7d3f">HDR — медленно, но точно</text>
  <line class="dna" x1="510" y1="320" x2="850" y2="320"/>
  <line x1="660" y1="308" x2="660" y2="332" stroke="#2f7d3f" stroke-width="4"/>
  <text class="s" x="510" y="350">донорская ДНК служит образцом</text>
  <text class="s" x="510" y="366">для точной починки разрыва</text>
  <rect x="620" y="392" width="80" height="16" rx="4" fill="#3fa34d"/>
  <line class="dna" x1="510" y1="404" x2="620" y2="404"/>
  <line class="dna" x1="700" y1="404" x2="850" y2="404"/>
  <text class="s" x="510" y="432">заданное изменение встроено точно</text>
  <text class="s" x="510" y="448">на нужном месте</text>
  <text class="b" x="510" y="490" style="fill:#2f7d3f">Результат: точная правка (нокин)</text>
  <text class="s" x="510" y="510">исправление мутации или вставка фрагмента</text>
  <text class="s" x="510" y="530">нужна донорская матрица, активен в S/G2-фазе</text>
</svg>
