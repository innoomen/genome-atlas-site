<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="t d">
  <title id="t">Деметилирование ДНК через TET и как мутации IDH1/2 его блокируют</title>
  <desc id="d">Верхняя схема: 5-метилцитозин (5mC) последовательно окисляется ферментами TET (нужны Fe(II), альфа-кетоглутарат, кислород, витамин C) до 5hmC, 5fC и 5caC; 5fC и 5caC вырезает TDG, и путь эксцизионной репарации возвращает обычный цитозин. Нижняя схема: в норме IDH1 и IDH2 превращают изоцитрат в альфа-кетоглутарат. Мутантные IDH (R132 в IDH1, R140 или R172 в IDH2) вместо этого производят 2-гидроксиглутарат (2-HG), который конкурирует с альфа-кетоглутаратом и подавляет TET2 и гистоновые деметилазы. Итог: гиперметилирование ДНК, блок дифференцировки, острый миелоидный лейкоз. Ингибиторы: ивосидениб, олутасидениб (IDH1), энасидениб (IDH2).</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #5b6577; }
    .w { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .box { fill: #f5f7fb; stroke: #b7c0cf; stroke-width: 1.6; }
    .ar { stroke: #5b6577; stroke-width: 2.4; fill: none; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker>
  <marker id="inh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M6 0 v10" stroke="#c0392b" stroke-width="2.5"/></marker></defs>
  <rect width="900" height="610" fill="#ffffff"/>
  <text class="h" x="20" y="28">Активное деметилирование: TET и его «поломка» при мутациях IDH</text>

  <!-- цепочка -->
  <g>
    <rect x="20" y="60" width="120" height="70" rx="12" fill="#f6dfda" stroke="#d1432f" stroke-width="2"/><text class="b" x="80" y="88" text-anchor="middle">5mC</text><text class="s" x="80" y="108" text-anchor="middle" style="font-size:11px">метилцитозин</text>
    <rect x="200" y="60" width="120" height="70" rx="12" fill="#f9e9cf" stroke="#e0a43a" stroke-width="2"/><text class="b" x="260" y="88" text-anchor="middle">5hmC</text><text class="s" x="260" y="108" text-anchor="middle" style="font-size:11px">гидроксиметил</text>
    <rect x="380" y="60" width="120" height="70" rx="12" fill="#f9e9cf" stroke="#e0a43a" stroke-width="2"/><text class="b" x="440" y="88" text-anchor="middle">5fC</text><text class="s" x="440" y="108" text-anchor="middle" style="font-size:11px">формилцитозин</text>
    <rect x="560" y="60" width="120" height="70" rx="12" fill="#f9e9cf" stroke="#e0a43a" stroke-width="2"/><text class="b" x="620" y="88" text-anchor="middle">5caC</text><text class="s" x="620" y="108" text-anchor="middle" style="font-size:11px">карбоксилцитозин</text>
    <rect x="760" y="60" width="120" height="70" rx="12" fill="#dcefdf" stroke="#3fa34d" stroke-width="2"/><text class="b" x="820" y="88" text-anchor="middle">C</text><text class="s" x="820" y="108" text-anchor="middle" style="font-size:11px">цитозин</text>
  </g>
  <path class="ar" d="M140 95 H196" marker-end="url(#ar)"/><path class="ar" d="M320 95 H376" marker-end="url(#ar)"/><path class="ar" d="M500 95 H556" marker-end="url(#ar)"/><path class="ar" d="M680 95 H756" marker-end="url(#ar)"/>
  <text class="b" x="168" y="80" text-anchor="middle" style="fill:#5e3f8a;font-size:11.5px">TET</text><text class="b" x="348" y="80" text-anchor="middle" style="fill:#5e3f8a;font-size:11.5px">TET</text><text class="b" x="528" y="80" text-anchor="middle" style="fill:#5e3f8a;font-size:11.5px">TET</text>
  <text class="b" x="718" y="70" text-anchor="middle" style="fill:#2f7d3f;font-size:11.5px">TDG + BER</text><text class="s" x="790" y="146" text-anchor="end" style="font-size:10.5px">вырезание и репарация</text>
  <text class="s" x="20" y="158" style="font-size:12px">TET нужны Fe(II), α-кетоглутарат (α-KG), O₂ и витамин C.</text>
  <text class="s" x="20" y="176" style="font-size:12px">Второй путь — пассивное «разбавление» метки: 5mC/5hmC не копируются DNMT1 при делениях.</text>

  <line x1="20" y1="180" x2="880" y2="180" stroke="#e1e6ee" stroke-width="2"/>
  <text class="h" x="20" y="208">Откуда берётся α-кетоглутарат — и что ломают мутации IDH</text>

  <!-- норма -->
  <rect class="box" x="20" y="222" width="400" height="230" rx="12"/>
  <text class="b" x="36" y="246" style="fill:#2f7d3f">Нормальный IDH1/2</text>
  <text class="b" x="36" y="292">изоцитрат</text>
  <path class="ar" d="M120 288 H220" marker-end="url(#ar)"/>
  <text class="b" x="120" y="278" style="fill:#3b6fd4;font-size:11.5px">IDH1 / IDH2</text>
  <text class="b" x="228" y="292">α-KG</text>
  <text class="s" x="36" y="312" style="font-size:11px">NADP⁺ → NADPH</text>
  <path class="ar" d="M260 300 V346" marker-end="url(#ar)"/>
  <rect x="200" y="350" width="120" height="30" rx="10" fill="#7b5ea7"/><text class="w" x="260" y="370">TET2 · KDM</text>
  <text class="s" x="36" y="404" style="font-size:11.5px">α-KG — «топливо» TET2 и гистоновых деметилаз (KDM):</text>
  <text class="s" x="36" y="420" style="font-size:11.5px">метки снимаются, гены дифференцировки включаются.</text>
  <text class="s" x="36" y="436" style="font-size:11.5px">IDH1 — цитоплазма/пероксисомы, IDH2 — митохондрии.</text>

  <!-- мутант -->
  <rect class="box" x="440" y="222" width="440" height="230" rx="12" style="fill:#fdf1ef;stroke:#e0a89f"/>
  <text class="b" x="456" y="246" style="fill:#c0392b">Мутантный IDH1 (R132) / IDH2 (R140, R172)</text>
  <text class="b" x="456" y="292">α-KG</text>
  <path class="ar" d="M504 288 H610" marker-end="url(#ar)"/>
  <text class="b" x="512" y="278" style="fill:#c0392b;font-size:11.5px">IDH-мутант</text>
  <text class="b" x="618" y="292" style="fill:#c0392b">2-HG</text><text class="s" x="666" y="292" style="font-size:11px">«онкометаболит»</text>
  <text class="s" x="456" y="312" style="font-size:11px">NADPH → NADP⁺ (уходит)</text>
  <path d="M640 300 V346" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#inh)"/>
  <rect x="580" y="350" width="120" height="30" rx="10" fill="#b7c0cf"/><text class="w" x="640" y="370" style="fill:#5b6577">TET2 · KDM ✕</text>
  <text class="s" x="456" y="404" style="font-size:11.5px">2-HG вытесняет α-KG и подавляет TET2 → гиперметилирование ДНК</text>
  <text class="s" x="456" y="420" style="font-size:11.5px">(CIMP-подобный профиль), блок созревания клеток → ОМЛ.</text>
  <text class="s" x="456" y="436" style="font-size:11.5px">Мутации IDH и TET2 обычно взаимно исключают друг друга.</text>

  <rect class="box" x="20" y="468" width="860" height="126" rx="12" style="fill:#eef8f0;stroke:#9ed0a8"/>
  <text class="b" x="36" y="492" style="fill:#2f7d3f">Терапевтический вывод</text>
  <text class="s" x="36" y="512">Ивосидениб и олутасидениб (мишень — мутантный IDH1) и энасидениб (мутантный IDH2) снижают уровень 2-HG</text>
  <text class="s" x="36" y="530">и «снимают» блок дифференцировки. Побочный эффект — дифференцировочный синдром: его нужно распознавать и лечить.</text>
  <text class="s" x="36" y="548">Мутации определяют NGS-панелью при первичной диагностике ОМЛ. 2-HG в сыворотке — маркер активности (в исследованиях).</text>
  <text class="s" x="36" y="572">Схема упрощена; показания и режимы — по актуальным рекомендациям.</text>
</svg>