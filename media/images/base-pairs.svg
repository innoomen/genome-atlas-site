<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Комплементарные пары оснований A–T и G–C</title>
  <desc id="d">Структурные формулы комплементарных пар. Пара аденин–тимин удерживается двумя водородными связями, пара гуанин–цитозин — тремя. Водородные связи показаны оранжевыми пунктирами. В каждой паре один пурин и один пиримидин.</desc>
