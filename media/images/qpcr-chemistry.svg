<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d">
  <title id="t">Real-time ПЦР: SYBR Green и TaqMan-зонды, кривая амплификации</title>
  <desc id="d">Слева химия SYBR Green: краситель встраивается в любую двухцепочечную ДНК и светится, поэтому нужна кривая плавления для проверки специфичности. Справа химия TaqMan: зонд с флуорофором и гасителем на концах; полимераза при синтезе новой цепи разрушает зонд своей 5'-3' экзонуклеазной активностью, флуорофор освобождается от гасителя и начинает светиться — сигнал возникает только при амплификации целевой последовательности. Внизу типичная кривая амплификации: сигнал флуоресценции по оси Y, номер цикла по оси X; пороговая линия определяет Ct (Cq) — цикл, на котором сигнал впервые превышает порог; чем больше исходного материала, тем раньше Ct.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #5b6577; }
    .w { font-size: 10px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .box { fill: #f5f7fb; stroke: #b7c0cf; stroke-width: 1.6; }
    .dna { stroke: #2f3f7a; stroke-width: 4; fill: none; stroke-linecap: round; }
  </style>
  <rect width="900" height="620" fill="#ffffff"/>
  <text class="h" x="20" y="28">Как увидеть амплификацию в реальном времени</text>

  <!-- SYBR -->
  <rect class="box" x="20" y="44" width="420" height="230" rx="10"/>
  <text class="b" x="34" y="68" style="fill:#b4531a">SYBR Green — неспецифичный краситель</text>
  <line class="dna" x1="50" y1="120" x2="260" y2="120"/><line class="dna" x1="50" y1="136" x2="260" y2="136"/>
  <circle cx="90" cy="128" r="6" fill="#3fa34d"/><circle cx="150" cy="128" r="6" fill="#3fa34d"/><circle cx="210" cy="128" r="6" fill="#3fa34d"/>
  <text class="s" x="280" y="132" style="font-size:11px">светится при встраивании</text>
  <text class="s" x="280" y="148" style="font-size:11px">в любую дцДНК</text>
  <text class="s" x="34" y="184" style="font-size:11.5px">Дёшево и просто, но не различает</text>
  <text class="s" x="34" y="200" style="font-size:11.5px">целевой продукт и неспецифичный</text>
  <text class="s" x="34" y="216" style="font-size:11.5px">(например, димеры праймеров).</text>
  <text class="s" x="34" y="240" style="font-size:11px;fill:#b4531a">Нужна кривая плавления —</text>
  <text class="s" x="34" y="256" style="font-size:11px;fill:#b4531a">проверка специфичности продукта.</text>

  <!-- TaqMan -->
  <rect class="box" x="460" y="44" width="420" height="230" rx="10"/>
  <text class="b" x="474" y="68" style="fill:#2f7d3f">TaqMan-зонд — специфичная</text>
  <line class="dna" x1="490" y1="110" x2="760" y2="110"/>
  <rect x="580" y="100" width="70" height="16" rx="4" fill="#e0e6ef" stroke="#8a94a8"/>
  <circle cx="586" cy="108" r="7" fill="#3fa34d"/><text class="w" x="586" y="111" style="font-size:7px">F</text>
  <circle cx="644" cy="108" r="7" fill="#5b6577"/><text class="w" x="644" y="111" style="font-size:7px">Q</text>
  <text class="s" x="490" y="90" style="font-size:10.5px">зонд связан: гаситель рядом — сигнала нет</text>
  <ellipse cx="510" cy="160" rx="20" ry="12" fill="#7b5ea7"/><text class="w" x="510" y="163" style="font-size:8px">Taq</text>
  <line class="dna" x1="530" y1="160" x2="700" y2="160"/>
  <circle cx="600" cy="180" r="7" fill="#3fa34d"/><text class="s" x="616" y="184" style="font-size:10.5px">флуорофор освобождён — светится</text>
  <circle cx="650" cy="198" r="6" fill="#5b6577"/><text class="s" x="662" y="202" style="font-size:10px">гаситель отделён</text>
  <text class="s" x="474" y="228" style="font-size:11.5px">5'→3'-экзонуклеаза Taq разрушает</text>
  <text class="s" x="474" y="244" style="font-size:11.5px">зонд только при синтезе цели —</text>
  <text class="s" x="474" y="260" style="font-size:11.5px;fill:#2f7d3f">сигнал строго специфичен.</text>

  <!-- кривая -->
  <text class="h" x="20" y="310">Кривая амплификации и порог Ct (Cq)</text>
  <line x1="60" y1="560" x2="860" y2="560" stroke="#8a94a8" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="60" y2="560" stroke="#8a94a8" stroke-width="1.5"/>
  <text class="s" x="16" y="350" style="font-size:10px">сигнал</text><text class="s" x="440" y="590" style="font-size:11px">номер цикла</text>
  <line x1="60" y1="470" x2="860" y2="470" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/><text class="s" x="800" y="464" style="font-size:10.5px;fill:#c0392b">порог</text>
  <path d="M60 556 C150 555 220 552 260 530 S 330 400 420 360 S 600 348 860 346" fill="none" stroke="#3b6fd4" stroke-width="2.6"/>
  <circle cx="300" cy="470" r="5" fill="#3b6fd4"/><text class="s" x="308" y="466" style="font-size:10.5px">Ct = 18 (много материала)</text>
  <path d="M60 558 C220 557 320 554 400 546 S 520 470 620 420 S 780 370 860 356" fill="none" stroke="#3fa34d" stroke-width="2.6"/>
  <circle cx="560" cy="470" r="5" fill="#3fa34d"/><text class="s" x="568" y="466" style="font-size:10.5px">Ct = 28 (мало материала)</text>
  <text class="s" x="60" y="330" style="font-size:11px">Чем раньше сигнал пересекает порог, тем больше было исходного материала — на этом основана количественная ПЦР.</text>
</svg>
