  <circle cx="342" cy="96" r="8" fill="#e4572e"/><text class="s" x="358" y="101">A — аденин</text>
  <circle cx="342" cy="126" r="8" fill="#2e86ab"/><text class="s" x="358" y="131">T — тимин</text>
