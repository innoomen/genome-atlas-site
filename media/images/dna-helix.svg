  <text class="h" x="330" y="240">Правила спаривания</text>
  <text class="s" x="330" y="266">A = T — две водородные связи</text>
  <text class="s" x="330" y="288">G ≡ C — три водородные связи</text>

  <line x1="330" y1="330" x2="362" y2="330" stroke="#4b4f9e" stroke-width="5" stroke-linecap="round"/>
  <text class="s" x="372" y="335">Сахарофосфатный остов</text>
  <text class="s" x="330" y="366">5′ и 3′ — концы цепей.</text>
  <text class="s" x="330" y="386">Цепи антипараллельны:</text>
  <text class="s" x="330" y="406">одна идёт 5′→3′,</text>
  <text class="s" x="330" y="426">другая 3′→5′.</text>
  <text class="s" x="330" y="470">Один виток ≈ 10,5 пар</text>
  <text class="s" x="330" y="490">оснований (≈ 3,6 нм).</text>
