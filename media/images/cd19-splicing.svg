<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d">
  <title id="t">Альтернативный сплайсинг CD19 и устойчивость к CAR-T-терапии</title>
  <desc id="d">Слева нормальный сплайсинг гена CD19: экзоны 1–4 сшиваются, белок CD19 на поверхности В-клетки содержит участок, который распознаёт CAR. Справа вариант с пропуском экзона 2: в мРНК нет участка, кодирующего внеклеточный эпитоп, белок укорочен или не доходит до поверхности, CAR-T-клетка не находит мишень, лейкозная клетка ускользает и возникает рецидив. Внизу — возможные решения: CAR против других антигенов (CD22, CD20), биспецифические CAR, мониторинг изоформ.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #5b6577; }
    .w { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .box { fill: #f5f7fb; stroke: #b7c0cf; stroke-width: 1.6; }
    .ex { fill: #2e6f95; }
    .in { stroke: #2f3f7a; stroke-width: 2.5; fill: none; }
    .arc { stroke: #3fa34d; stroke-width: 2.6; fill: none; }
    .mem { fill: #f0d9b0; stroke: #b98a3e; stroke-width: 1.5; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text class="h" x="20" y="28">CD19: один экзон решает, увидит ли CAR-T свою мишень</text>

  <!-- норма -->
  <rect class="box" x="20" y="44" width="430" height="330" rx="12"/>
  <text class="b" x="36" y="68" style="fill:#2f7d3f">Нормальный сплайсинг</text>
  <rect class="ex" x="40" y="104" width="40" height="22"/><text class="w" x="60" y="119">1</text>
  <line class="in" x1="80" y1="115" x2="120" y2="115"/><rect class="ex" x="120" y="104" width="60" height="22" style="fill:#c0392b"/><text class="w" x="150" y="119">2</text>
  <line class="in" x1="180" y1="115" x2="220" y2="115"/><rect class="ex" x="220" y="104" width="60" height="22"/><text class="w" x="250" y="119">3</text>
  <line class="in" x1="280" y1="115" x2="320" y2="115"/><rect class="ex" x="320" y="104" width="60" height="22"/><text class="w" x="350" y="119">4</text>
  <path class="arc" d="M80 104 Q100 84 120 104"/><path class="arc" d="M180 104 Q200 84 220 104"/><path class="arc" d="M280 104 Q300 84 320 104"/>
  <path d="M250 140 V176" stroke="#5b6577" stroke-width="2" fill="none" marker-end="url(#ar)"/><text class="s" x="262" y="163">мРНК → белок</text>
  <!-- мембрана -->
  <rect class="mem" x="60" y="300" width="360" height="26" rx="6"/><text class="s" x="240" y="317" text-anchor="middle" style="fill:#7a5a1e">мембрана В-клетки</text>
  <path d="M240 300 V216" stroke="#2e6f95" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="240" cy="204" rx="40" ry="18" fill="#2e6f95"/><circle cx="216" cy="200" r="9" fill="#c0392b"/>
  <text class="s" x="240" y="240" text-anchor="start" style="font-size:11.5px" transform="translate(12 0)">CD19</text>
  <path d="M154 176 L208 196" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text class="s" x="40" y="214" style="font-size:11px;fill:#c0392b">эпитоп (экзон 2)</text>
  <!-- CAR-T -->
  <rect x="140" y="148" width="20" height="30" rx="4" fill="#3fa34d" transform="rotate(-24 150 163)"/>
  <text class="b" x="330" y="180" style="fill:#2f7d3f;font-size:12px">CAR-T</text><text class="s" x="330" y="196" style="font-size:11px">связывает CD19</text>
  <text class="s" x="36" y="350">CAR-T находит мишень и убивает В-клетку.</text>

  <!-- пропуск экзона 2 -->
  <rect class="box" x="470" y="44" width="410" height="330" rx="12"/>
  <text class="b" x="486" y="68" style="fill:#c0392b">Пропуск экзона 2</text>
  <rect class="ex" x="490" y="104" width="40" height="22"/><text class="w" x="510" y="119">1</text>
  <line class="in" x1="530" y1="115" x2="570" y2="115"/><rect class="ex" x="570" y="104" width="60" height="22" opacity=".3"/><text class="w" x="600" y="119" style="fill:#5b6577">2</text>
  <line class="in" x1="630" y1="115" x2="670" y2="115"/><rect class="ex" x="670" y="104" width="60" height="22"/><text class="w" x="700" y="119">3</text>
  <line class="in" x1="730" y1="115" x2="770" y2="115"/><rect class="ex" x="770" y="104" width="60" height="22"/><text class="w" x="800" y="119">4</text>
  <path class="arc" d="M530 104 C600 60 640 60 670 104"/><path class="arc" d="M730 104 Q750 84 770 104"/>
  <path d="M700 140 V176" stroke="#5b6577" stroke-width="2" fill="none" marker-end="url(#ar)"/><text class="s" x="712" y="163">укороченный белок</text>
  <rect class="mem" x="510" y="300" width="360" height="26" rx="6"/><text class="s" x="690" y="317" text-anchor="middle" style="fill:#7a5a1e">мембрана лейкозной клетки</text>
  <path d="M690 300 V256" stroke="#8a94a8" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/>
  <ellipse cx="690" cy="246" rx="26" ry="11" fill="#b7c0cf"/>
  <text class="s" x="690" y="232" text-anchor="middle" style="font-size:11px">CD19 без эпитопа</text>
  <rect x="540" y="176" width="20" height="30" rx="4" fill="#3fa34d" transform="rotate(30 550 190)"/>
  <text class="s" x="586" y="190" style="fill:#c0392b;font-size:11px">CAR-T не находит мишень</text>
  <text class="s" x="486" y="350">Клетка ускользает от CAR-T → рецидив В-ОЛЛ,</text><text class="s" x="486" y="366" style="font-size:11.5px">CD19-негативный или CD19 с изменённым эпитопом.</text>

  <text class="b" x="20" y="404">Что с этим делают</text>
  <rect class="box" x="20" y="416" width="280" height="80" rx="10"/><text class="b" x="34" y="438" style="font-size:12.5px">Другая мишень</text><text class="s" x="34" y="458">CAR или антитела против CD22,</text><text class="s" x="34" y="474">CD20; биспецифические CAR</text><text class="s" x="34" y="490">(CD19/CD22, CD19/CD20).</text>
  <rect class="box" x="310" y="416" width="280" height="80" rx="10"/><text class="b" x="324" y="438" style="font-size:12.5px">Мониторинг</text><text class="s" x="324" y="458">Проточная цитометрия с разными</text><text class="s" x="324" y="474">клонами антител, секвенирование</text><text class="s" x="324" y="490">РНК перед/после терапии.</text>
  <rect class="box" x="600" y="416" width="280" height="80" rx="10"/><text class="b" x="614" y="438" style="font-size:12.5px">Понимание механизма</text><text class="s" x="614" y="458">Пропуск экзона 2 связывали с</text><text class="s" x="614" y="474">SRSF3 — потенциальная точка для</text><text class="s" x="614" y="490">воздействия (исследования).</text>
  <text class="s" x="20" y="520" style="font-size:11.5px">Кроме сплайсинга, устойчивость даёт потеря CD19 из-за мутаций гена. Схема упрощена: число экзонов и размеры не в масштабе.</text>
</svg>
