<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Кариотип: G-бэндинг и номенклатура ISCN</title>
  <desc id="d">Слева схема получения кариотипа: клетки останавливают в метафазе, окрашивают трипсином и красителем Гимза, под микроскопом фотографируют хромосомы и раскладывают их по 23 парам от самой крупной к самой мелкой — получается кариограмма. Каждая хромосома делится на короткое плечо p и длинное плечо q, а внутри — на пронумерованные полосы (банды), видимые благодаря разной плотности прокраски. Справа — пример записи по номенклатуре ISCN: 46,XX,t(9;22)(q34;q11.2) означает нормальное число хромосом, женский пол, и транслокацию между полосой q34 хромосомы 9 и полосой q11.2 хромосомы 22 — классический признак филадельфийской хромосомы.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #5b6577; }
    .box { fill: #f5f7fb; stroke: #b7c0cf; stroke-width: 1.6; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text class="h" x="20" y="28">Кариотип: 46 хромосом под микроскопом, разложенные по парам</text>

  <rect class="box" x="20" y="44" width="270" height="280" rx="10"/>
  <text class="b" x="34" y="66">1. Клетки в метафазе</text>
  <circle cx="155" cy="120" r="34" fill="#e7f1fb" stroke="#3b6fd4" stroke-width="1.6"/>
  <path d="M140 112 q6 -10 12 0 q6 -10 12 0" stroke="#2f3f7a" stroke-width="3" fill="none"/>
  <path d="M140 128 q6 -10 12 0 q6 -10 12 0" stroke="#2f3f7a" stroke-width="3" fill="none"/>
  <text class="s" x="34" y="172">Деление культуры клеток крови</text>
  <text class="s" x="34" y="188">или костного мозга останавливают</text>
  <text class="s" x="34" y="204">в метафазе (колхицин).</text>
  <text class="b" x="34" y="234">2. Окраска и раскладка</text>
  <text class="s" x="34" y="254">Трипсин + краситель Гимза дают</text>
  <text class="s" x="34" y="270">полосатый рисунок (G-бэндинг);</text>
  <text class="s" x="34" y="286">хромосомы фотографируют и</text>
  <text class="s" x="34" y="302">раскладывают по 23 парам —</text>
  <text class="s" x="34" y="318" style="font-weight:700">кариограмма.</text>

  <rect class="box" x="310" y="44" width="270" height="280" rx="10"/>
  <text class="b" x="324" y="66">3. Плечи и полосы</text>
  <rect x="380" y="90" width="24" height="200" rx="12" fill="#8fb0dd"/>
  <line x1="380" y1="150" x2="404" y2="150" stroke="#fff" stroke-width="3"/>
  <rect x="382" y="96" width="20" height="10" fill="#2f3f7a"/><rect x="382" y="112" width="20" height="8" fill="#b7c0cf"/><rect x="382" y="124" width="20" height="14" fill="#2f3f7a"/>
  <rect x="382" y="158" width="20" height="12" fill="#b7c0cf"/><rect x="382" y="174" width="20" height="18" fill="#2f3f7a"/><rect x="382" y="196" width="20" height="10" fill="#b7c0cf"/><rect x="382" y="210" width="20" height="20" fill="#2f3f7a"/><rect x="382" y="234" width="20" height="14" fill="#b7c0cf"/><rect x="382" y="252" width="20" height="24" fill="#2f3f7a"/>
  <text class="s" x="340" y="100" text-anchor="end">короткое</text><text class="s" x="340" y="114" text-anchor="end">плечо — p</text>
  <text class="s" x="340" y="210" text-anchor="end">длинное</text><text class="s" x="340" y="224" text-anchor="end">плечо — q</text>
  <text class="s" x="412" y="150">центромера</text>
  <text class="s" x="412" y="180">полосы (банды)</text>
  <text class="s" x="412" y="196">нумеруются от</text>
  <text class="s" x="412" y="212">центромеры наружу</text>
  <text class="s" x="324" y="300" style="font-size:10.5px">Разрешение G-бэндинга — около 5–10 млн п.н.: тонкие изменения он не видит (для этого нужны FISH или NGS).</text>

  <rect class="box" x="600" y="44" width="280" height="280" rx="10" style="fill:#fff8e8;stroke:#e0a43a"/>
  <text class="b" x="614" y="66">4. Запись по ISCN</text>
  <text class="b" x="614" y="100" style="font-size:15px;fill:#b4531a">46,XX,t(9;22)(q34;q11.2)</text>
  <text class="s" x="614" y="128">46 — число хромосом (норма)</text>
  <text class="s" x="614" y="146">XX — женский пол</text>
  <text class="s" x="614" y="168">t(9;22) — транслокация между</text>
  <text class="s" x="614" y="184">хромосомами 9 и 22</text>
  <text class="s" x="614" y="206">(q34;q11.2) — точки разрыва:</text>
  <text class="s" x="614" y="222">полоса q34 девятой и q11.2</text>
  <text class="s" x="614" y="238">двадцать второй хромосомы</text>
  <text class="s" x="614" y="266" style="fill:#c0392b;font-weight:700">= филадельфийская хромосома</text>
  <text class="s" x="614" y="284" style="font-size:10.5px">(см. тему «BCR::ABL1»)</text>

  <rect class="box" x="20" y="340" width="860" height="140" rx="10" style="fill:#eef8f0;stroke:#9ed0a8"/>
  <text class="b" x="34" y="364">Что показывает кариотип, чего не видят прицельные тесты</text>
  <text class="s" x="34" y="386">Это единственный «обзорный» метод: он одновременно видит числовые аномалии (трисомии, моносомии), крупные</text>
  <text class="s" x="34" y="404">транслокации, инверсии и делеции по всему геному сразу, включая неожиданные перестройки, которые не искали специально.</text>
  <text class="s" x="34" y="422">Ограничения: нужны делящиеся клетки (не все опухоли хорошо растут в культуре), результат готов через 1–3 недели, разрешение</text>
  <text class="s" x="34" y="440">ограничено ~5–10 млн п.н. — точечные мутации и мелкие перестройки он не находит.</text>
  <text class="s" x="34" y="462" style="font-size:11px">«Сложный кариотип» (≥ 3 аномалий) — самостоятельный неблагоприятный прогностический признак при МДС и ОМЛ.</text>
</svg>
