<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">Трансляция: рибосома, мРНК и тРНК</title>
  <desc id="d">Рибосома состоит из большой и малой субъединиц и движется по мРНК слева направо. В сайтах E, P и A находятся тРНК, антикодоны которых спарены с кодонами мРНК. От тРНК в P-сайте отходит растущая цепь аминокислот.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #5b6577; }
    .m { font-family: ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .aa { font-size: 10px; font-weight: 700; text-anchor: middle; fill: #fff; }
  </style>
  <rect width="760" height="420" fill="#fff"/>

  <!-- рибосома -->
  <rect x="205" y="82" width="230" height="92" rx="46" fill="#cfe0f2" stroke="#2e6f95" stroke-width="2.5"/>
  <text class="h" x="196" y="132" text-anchor="end" style="fill:#2e6f95">большая субъединица</text>
  <rect x="215" y="180" width="210" height="38" rx="19" fill="#e3d4f0" stroke="#7b5ea7" stroke-width="2.5"/>
  <text class="h" x="206" y="204" text-anchor="end" style="fill:#7b5ea7">малая субъединица</text>

  <!-- мРНК -->
  <line x1="60" y1="272" x2="700" y2="272" stroke="#ee8a2b" stroke-width="4"/>
  <text class="h" x="20" y="262">мРНК</text><text class="s" x="20" y="290">5′</text><text class="s" x="712" y="290">3′</text>
  <g>
    <rect x="128" y="256" width="60" height="32" rx="4" fill="#fff4e5" stroke="#ee8a2b" stroke-width="2"/><text class="m" x="158" y="278">AUG</text>
    <rect x="188" y="256" width="60" height="32" rx="4" fill="#fff4e5" stroke="#ee8a2b" stroke-width="2"/><text class="m" x="218" y="278">GCU</text>
    <rect x="248" y="256" width="60" height="32" rx="4" fill="#fff4e5" stroke="#ee8a2b" stroke-width="2"/><text class="m" x="278" y="278">AAA</text>
    <rect x="308" y="256" width="60" height="32" rx="4" fill="#fff4e5" stroke="#ee8a2b" stroke-width="2"/><text class="m" x="338" y="278">GGU</text>
    <rect x="368" y="256" width="60" height="32" rx="4" fill="#fff4e5" stroke="#ee8a2b" stroke-width="2"/><text class="m" x="398" y="278">CUG</text>
    <rect x="428" y="256" width="60" height="32" rx="4" fill="#fff4e5" stroke="#ee8a2b" stroke-width="2"/><text class="m" x="458" y="278">UAA</text>
  </g>

  <!-- тРНК: E (AUG уже прочитан -> покидает; занят кодон GCU), сдвиг: E = GCU, P = AAA, A = GGU -->
  <!-- E -->
  <g opacity=".55">
    <line x1="218" y1="246" x2="218" y2="134" stroke="#3a3f4b" stroke-width="4"/>
    <rect x="203" y="236" width="30" height="14" rx="3" fill="#3a3f4b"/><text class="aa" x="218" y="247" style="font-size:9px">CGA</text>
    <circle cx="218" cy="128" r="12" fill="#9aa5b8"/>
  </g>
  <!-- P -->
  <line x1="278" y1="246" x2="278" y2="134" stroke="#3a3f4b" stroke-width="4"/>
  <rect x="263" y="236" width="30" height="14" rx="3" fill="#3a3f4b"/><text class="aa" x="278" y="247" style="font-size:9px">UUU</text>
  <circle cx="278" cy="128" r="12" fill="#3fa34d"/><text class="aa" x="278" y="132">Lys</text>
  <!-- A -->
  <line x1="338" y1="246" x2="338" y2="134" stroke="#3a3f4b" stroke-width="4"/>
  <rect x="323" y="236" width="30" height="14" rx="3" fill="#3a3f4b"/><text class="aa" x="338" y="247" style="font-size:9px">CCA</text>
  <circle cx="338" cy="128" r="12" fill="#e4572e"/><text class="aa" x="338" y="132">Gly</text>

  <!-- растущая цепь -->
  <g>
    <circle cx="256" cy="98" r="11" fill="#2e86ab"/><text class="aa" x="256" y="102">Ala</text>
    <circle cx="233" cy="70" r="11" fill="#f0b429"/><text class="aa" x="233" y="74" style="fill:#1c2330">Met</text>
  </g>
  <path d="M278 116 L262 106" stroke="#3a3f4b" stroke-width="3"/>
  <path d="M250 88 L238 78" stroke="#3a3f4b" stroke-width="3"/>
  <path d="M222 62 C200 44 170 40 150 44" fill="none" stroke="#3a3f4b" stroke-width="3" stroke-dasharray="3 3"/>

  <!-- сайты -->
  <g class="h" text-anchor="middle" style="fill:#1c2330">
    <text x="218" y="158" style="fill:#1c2330">E</text>
    <text x="278" y="158" style="fill:#1c2330">P</text>
    <text x="338" y="158" style="fill:#1c2330">A</text>
  </g>

  <!-- подписи и стрелки -->
  <line x1="470" y1="330" x2="600" y2="330" stroke="#5b6577" stroke-width="2.5" marker-end="url(#ar)"/>
  <text class="s" x="612" y="335">рибосома движется к 3′-концу</text>
  <text class="s" x="440" y="146">E — выход тРНК</text>
  <text class="s" x="440" y="164">P — сайт растущей цепи</text>
  <text class="s" x="440" y="182">A — вход новой аминоацил-тРНК</text>
  <text class="s" x="20" y="52">растущая цепь</text>
  <text class="s" x="20" y="68">белка</text>
  <text class="s" x="370" y="234">антикодоны тРНК</text>
  <text class="s" x="20" y="386">Кодоны в сайтах E, P и A: GCU, AAA, GGU. Антикодон читается навстречу кодону (антипараллельно).</text>
  <text class="s" x="20" y="406">Схема упрощена и не в масштабе.</text>
</svg>
