<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="t d">
  <title id="t">Полуконсервативная репликация ДНК</title>
  <desc id="d">Родительская двойная спираль (тёмные цепи) расплетается; каждая цепь служит матрицей для новой цепи (оранжевая). В результате получаются две дочерние молекулы, каждая из которых содержит одну старую и одну новую цепь.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; }
    .old { stroke: #2f3f7a; stroke-width: 6; stroke-linecap: round; fill: none; }
    .new { stroke: #ee8a2b; stroke-width: 6; stroke-linecap: round; fill: none; }
    .rung { stroke: #b4bccb; stroke-width: 2; }
  </style>
  <rect width="700" height="400" fill="#fff"/>

  <!-- Родительская молекула -->
  <text class="h" x="20" y="30">1. Родительская ДНК</text>
  <line class="old" x1="240" y1="20" x2="640" y2="20"/><line class="old" x1="240" y1="50" x2="640" y2="50"/>
  <g class="rung"><line x1="270" y1="20" x2="270" y2="50"/><line x1="310" y1="20" x2="310" y2="50"/><line x1="350" y1="20" x2="350" y2="50"/><line x1="390" y1="20" x2="390" y2="50"/><line x1="430" y1="20" x2="430" y2="50"/><line x1="470" y1="20" x2="470" y2="50"/><line x1="510" y1="20" x2="510" y2="50"/><line x1="550" y1="20" x2="550" y2="50"/><line x1="590" y1="20" x2="590" y2="50"/><line x1="630" y1="20" x2="630" y2="50"/></g>
  <line x1="440" y1="66" x2="440" y2="92" stroke="#5b6577" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Расплетение -->
  <text class="h" x="20" y="140">2. Цепи расходятся,</text>
  <text class="h" x="20" y="160">строятся новые цепи</text>
  <line class="old" x1="240" y1="112" x2="640" y2="112"/><line class="old" x1="240" y1="200" x2="640" y2="200"/>
  <line class="new" x1="240" y1="130" x2="500" y2="130" stroke-dasharray="0"/><line class="new" x1="240" y1="182" x2="500" y2="182"/>
  <g class="rung"><line x1="270" y1="112" x2="270" y2="130"/><line x1="310" y1="112" x2="310" y2="130"/><line x1="350" y1="112" x2="350" y2="130"/><line x1="390" y1="112" x2="390" y2="130"/><line x1="430" y1="112" x2="430" y2="130"/><line x1="470" y1="112" x2="470" y2="130"/>
    <line x1="270" y1="182" x2="270" y2="200"/><line x1="310" y1="182" x2="310" y2="200"/><line x1="350" y1="182" x2="350" y2="200"/><line x1="390" y1="182" x2="390" y2="200"/><line x1="430" y1="182" x2="430" y2="200"/><line x1="470" y1="182" x2="470" y2="200"/></g>
  <text class="s" x="520" y="134" style="fill:#5b6577">← новая цепь растёт</text>
  <line x1="440" y1="216" x2="440" y2="242" stroke="#5b6577" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Дочерние -->
  <text class="h" x="20" y="290">3. Две дочерние</text>
  <text class="h" x="20" y="310">молекулы</text>
  <line class="old" x1="240" y1="260" x2="640" y2="260"/><line class="new" x1="240" y1="290" x2="640" y2="290"/>
  <g class="rung"><line x1="270" y1="260" x2="270" y2="290"/><line x1="310" y1="260" x2="310" y2="290"/><line x1="350" y1="260" x2="350" y2="290"/><line x1="390" y1="260" x2="390" y2="290"/><line x1="430" y1="260" x2="430" y2="290"/><line x1="470" y1="260" x2="470" y2="290"/><line x1="510" y1="260" x2="510" y2="290"/><line x1="550" y1="260" x2="550" y2="290"/><line x1="590" y1="260" x2="590" y2="290"/><line x1="630" y1="260" x2="630" y2="290"/></g>
  <line class="new" x1="240" y1="326" x2="640" y2="326"/><line class="old" x1="240" y1="356" x2="640" y2="356"/>
  <g class="rung"><line x1="270" y1="326" x2="270" y2="356"/><line x1="310" y1="326" x2="310" y2="356"/><line x1="350" y1="326" x2="350" y2="356"/><line x1="390" y1="326" x2="390" y2="356"/><line x1="430" y1="326" x2="430" y2="356"/><line x1="470" y1="326" x2="470" y2="356"/><line x1="510" y1="326" x2="510" y2="356"/><line x1="550" y1="326" x2="550" y2="356"/><line x1="590" y1="326" x2="590" y2="356"/><line x1="630" y1="326" x2="630" y2="356"/></g>

  <line x1="20" y1="382" x2="52" y2="382" class="old"/><text class="s" x="62" y="387">старая (родительская) цепь</text>
  <line x1="300" y1="382" x2="332" y2="382" class="new"/><text class="s" x="342" y="387">новая цепь</text>
</svg>
