<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="t d">
  <title id="t">Альтернативный сплайсинг генов семейства BCL2</title>
  <desc id="d">Вверху: семейство BCL2 — антиапоптотические белки (BCL2, BCL-XL, MCL1) против проапоптотических эффекторов BAX и BAK и белков с одним BH3-доменом. Ниже: ген BCL2L1 имеет два 5'-сайта сплайсинга в экзоне 2: дальний даёт длинную изоформу Bcl-xL с доменами BH4, BH3, BH1, BH2 и TM, подавляющую апоптоз; ближний даёт короткую Bcl-xS, потерявшую BH1 и BH2, которая способствует апоптозу. Ген MCL1: с экзоном 2 получается Mcl-1L (подавляет апоптоз), при пропуске экзона 2 — Mcl-1S (способствует апоптозу). Внизу клиническое значение.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #5b6577; }
    .w { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .k { font-size: 11px; font-weight: 700; fill: #1c2330; text-anchor: middle; }
    .c { fill: #2e6f95; } .a { fill: #ee8a2b; }
    .int { stroke: #8a94a8; stroke-width: 3; }
    .sp { stroke: #8a94a8; stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker>
  <marker id="inh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M6 0 v10" stroke="#c0392b" stroke-width="2.5"/></marker></defs>
  <rect width="900" height="720" fill="#ffffff"/>

  <!-- А. семейство -->
  <text class="h" x="20" y="26">А. Семейство BCL2: баланс решает судьбу клетки</text>
  <rect x="20" y="42" width="270" height="82" rx="12" fill="#eaf6ee" stroke="#3fa34d" stroke-width="2"/>
  <text class="b" x="34" y="64" style="fill:#2f7d3f">Против апоптоза</text><text class="s" x="34" y="84">BCL2, BCL-XL (BCL2L1),</text><text class="s" x="34" y="100">MCL1, BCL2A1</text><text class="s" x="34" y="116" style="font-size:11.5px">домены BH1–BH4</text>
  <rect x="330" y="42" width="240" height="82" rx="12" fill="#fdf1ef" stroke="#c0392b" stroke-width="2"/>
  <text class="b" x="344" y="64" style="fill:#c0392b">Эффекторы гибели</text><text class="s" x="344" y="84">BAX, BAK</text><text class="s" x="344" y="100">образуют поры в митохондриях</text><text class="s" x="344" y="116" style="font-size:11.5px">(выход цитохрома c)</text>
  <rect x="610" y="42" width="270" height="82" rx="12" fill="#fdf5e6" stroke="#ee8a2b" stroke-width="2"/>
  <text class="b" x="624" y="64" style="fill:#b4531a">Сенсоры (только BH3)</text><text class="s" x="624" y="84">BIM, BID, PUMA, NOXA, BAD</text><text class="s" x="624" y="100">запускают апоптоз при стрессе</text>
  <path d="M290 83 H326" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#inh)"/>
  <path d="M610 83 H574" stroke="#5b6577" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M750 42 C750 22 210 22 210 40" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#inh)"/>
  <text class="s" x="480" y="136" text-anchor="middle" style="font-size:11.5px">сенсоры блокируют белки «против апоптоза»</text>

  <line x1="20" y1="142" x2="880" y2="142" stroke="#e1e6ee" stroke-width="2"/>

  <!-- Б. BCL2L1 -->
  <text class="h" x="20" y="168">Б. BCL2L1 (Bcl-x): выбор 5'-сайта в экзоне 2</text>
  <line class="int" x1="40" y1="206" x2="500" y2="206"/>
  <rect class="c" x="40" y="193" width="60" height="26" rx="3"/><text class="w" x="70" y="210">экзон 1</text>
  <rect class="c" x="180" y="193" width="70" height="26" rx="3"/><rect class="a" x="250" y="193" width="90" height="26" rx="3"/><text class="w" x="215" y="210">экзон 2</text><text class="k" x="295" y="210">189 нт</text>
  <rect class="c" x="440" y="193" width="60" height="26" rx="3"/><text class="w" x="470" y="210">экзон 3</text>
  <path class="sp" d="M340 193 L390 170 L440 193"/><text class="s" x="390" y="164" text-anchor="middle" style="font-size:11.5px">дальний 5'-сайт</text>
  <path class="sp" d="M250 219 L345 244 L440 219"/><text class="s" x="345" y="262" text-anchor="middle" style="font-size:11.5px">ближний 5'-сайт</text>
  <!-- белки -->
  <text class="b" x="540" y="184" style="fill:#2f7d3f">Bcl-xL (длинная)</text>
  <rect x="540" y="192" width="330" height="28" rx="6" fill="#eaf6ee" stroke="#3fa34d" stroke-width="1.5"/>
  <rect x="546" y="197" width="44" height="18" rx="3" fill="#8b93c9"/><text class="w" x="568" y="210" style="font-size:10px">BH4</text>
  <rect x="596" y="197" width="44" height="18" rx="3" fill="#ee8a2b"/><text class="w" x="618" y="210" style="font-size:10px">BH3</text>
  <rect x="646" y="197" width="44" height="18" rx="3" fill="#2e6f95"/><text class="w" x="668" y="210" style="font-size:10px">BH1</text>
  <rect x="696" y="197" width="44" height="18" rx="3" fill="#2e86ab"/><text class="w" x="718" y="210" style="font-size:10px">BH2</text>
  <rect x="800" y="197" width="64" height="18" rx="3" fill="#6c7a96"/><text class="w" x="832" y="210" style="font-size:10px">TM</text>
  <text class="s" x="540" y="240">подавляет апоптоз (связывает BAX, BAK и BH3-белки)</text>
  <text class="b" x="540" y="272" style="fill:#c0392b">Bcl-xS (короткая)</text>
  <rect x="540" y="280" width="330" height="28" rx="6" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="546" y="285" width="44" height="18" rx="3" fill="#8b93c9"/><text class="w" x="568" y="298" style="font-size:10px">BH4</text>
  <rect x="596" y="285" width="44" height="18" rx="3" fill="#ee8a2b"/><text class="w" x="618" y="298" style="font-size:10px">BH3</text>
  <text class="s" x="668" y="298" style="font-size:11px">нет BH1 и BH2</text>
  <rect x="800" y="285" width="64" height="18" rx="3" fill="#6c7a96"/><text class="w" x="832" y="298" style="font-size:10px">TM</text>
  <text class="s" x="540" y="328">способствует апоптозу (нет 63 аминокислот)</text>

  <!-- В. MCL1 -->
  <line x1="20" y1="350" x2="880" y2="350" stroke="#e1e6ee" stroke-width="2"/>
  <text class="h" x="20" y="376">В. MCL1: пропуск экзона 2</text>
  <line class="int" x1="40" y1="414" x2="500" y2="414"/>
  <rect class="c" x="40" y="401" width="60" height="26" rx="3"/><text class="w" x="70" y="418">экзон 1</text>
  <rect class="a" x="220" y="401" width="90" height="26" rx="3"/><text class="w" x="265" y="418">экзон 2</text>
  <rect class="c" x="440" y="401" width="60" height="26" rx="3"/><text class="w" x="470" y="418">экзон 3</text>
  <path class="sp" d="M100 401 L170 378 L220 401"/><path class="sp" d="M310 401 L375 378 L440 401"/><text class="s" x="270" y="372" text-anchor="middle" style="font-size:11.5px">включён → Mcl-1L</text>
  <path class="sp" d="M100 427 L270 452 L440 427"/><text class="s" x="270" y="470" text-anchor="middle" style="font-size:11.5px">пропущен → Mcl-1S</text>
  <text class="b" x="540" y="392" style="fill:#2f7d3f">Mcl-1L</text>
  <rect x="540" y="400" width="330" height="28" rx="6" fill="#eaf6ee" stroke="#3fa34d" stroke-width="1.5"/>
  <rect x="546" y="405" width="60" height="18" rx="3" fill="#8b93c9"/><text class="w" x="576" y="418" style="font-size:10px">PEST</text>
  <rect x="612" y="405" width="44" height="18" rx="3" fill="#ee8a2b"/><text class="w" x="634" y="418" style="font-size:10px">BH3</text>
  <rect x="662" y="405" width="44" height="18" rx="3" fill="#2e6f95"/><text class="w" x="684" y="418" style="font-size:10px">BH1</text>
  <rect x="712" y="405" width="44" height="18" rx="3" fill="#2e86ab"/><text class="w" x="734" y="418" style="font-size:10px">BH2</text>
  <rect x="800" y="405" width="64" height="18" rx="3" fill="#6c7a96"/><text class="w" x="832" y="418" style="font-size:10px">TM</text>
  <text class="s" x="540" y="446">подавляет апоптоз</text>
  <text class="b" x="540" y="472" style="fill:#c0392b">Mcl-1S</text>
  <rect x="540" y="480" width="330" height="28" rx="6" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="546" y="485" width="44" height="18" rx="3" fill="#ee8a2b"/><text class="w" x="568" y="498" style="font-size:10px">BH3</text>
  <text class="s" x="600" y="498" style="font-size:11px">нет BH1, BH2 и TM: только «BH3»</text>
  <text class="s" x="540" y="526">способствует апоптозу</text>

  <!-- Г. клиника -->
  <line x1="20" y1="548" x2="880" y2="548" stroke="#e1e6ee" stroke-width="2"/>
  <text class="h" x="20" y="574">Г. Что это значит в гематологии</text>
  <text class="s" x="20" y="598">• Опухолевые клетки часто перегружены BCL2 и используют «запасные» белки MCL1 и BCL-XL: сдвиг сплайсинга в сторону L-форм</text>
  <text class="s" x="34" y="614">повышает выживаемость и может давать устойчивость к терапии.</text>
  <text class="s" x="20" y="634">• Венетоклакс блокирует BCL2 (ХЛЛ, ОМЛ); устойчивость связана в том числе с повышением MCL1 и BCL-XL.</text>
  <text class="s" x="20" y="654">• Исследуют «сплайс-переключающие» олигонуклеотиды, которые смещают выбор сайта в пользу проапоптотической Bcl-xS.</text>
  <text class="s" x="20" y="674">• Мутации факторов сплайсинга (SF3B1, SRSF2, U2AF1, ZRSR2) при МДС и ХЛЛ меняют сплайсинг многих генов.</text>
  <text class="s" x="20" y="694">• Уровень BCL2 повышен при t(14;18) (фолликулярная лимфома) и при потере генов miR-15/16 (del(13q14), ХЛЛ).</text>
</svg>
