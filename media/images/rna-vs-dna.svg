<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
  <title id="t">Сравнение ДНК и РНК</title>
  <desc id="d">Слева двухцепочечная ДНК с основаниями A, T, G, C и сахаром дезоксирибозой. Справа одноцепочечная РНК с основаниями A, U, G, C и сахаром рибозой.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 18px; font-weight: 700; }
    .s { font-size: 13.5px; }
    .b { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .bb { stroke: #4b4f9e; stroke-width: 5; stroke-linecap: round; }
  </style>
  <rect width="680" height="400" fill="#fff"/>

  <!-- ДНК -->
  <text class="h" x="170" y="34" text-anchor="middle">ДНК</text>
  <line class="bb" x1="30" y1="80" x2="310" y2="80"/>
  <line class="bb" x1="30" y1="170" x2="310" y2="170"/>
  <g stroke-width="3">
    <line x1="60" y1="80" x2="60" y2="170" stroke="#e4572e"/><line x1="105" y1="80" x2="105" y2="170" stroke="#3fa34d"/>
    <line x1="150" y1="80" x2="150" y2="170" stroke="#2e86ab"/><line x1="195" y1="80" x2="195" y2="170" stroke="#f0b429"/>
    <line x1="240" y1="80" x2="240" y2="170" stroke="#e4572e"/><line x1="285" y1="80" x2="285" y2="170" stroke="#3fa34d"/>
  </g>
  <g>
    <circle cx="60" cy="100" r="9" fill="#e4572e"/><text class="b" x="60" y="104">A</text>
    <circle cx="60" cy="150" r="9" fill="#2e86ab"/><text class="b" x="60" y="154">T</text>
    <circle cx="105" cy="100" r="9" fill="#3fa34d"/><text class="b" x="105" y="104">G</text>
    <circle cx="105" cy="150" r="9" fill="#f0b429"/><text class="b" x="105" y="154">C</text>
    <circle cx="150" cy="100" r="9" fill="#2e86ab"/><text class="b" x="150" y="104">T</text>
    <circle cx="150" cy="150" r="9" fill="#e4572e"/><text class="b" x="150" y="154">A</text>
    <circle cx="195" cy="100" r="9" fill="#f0b429"/><text class="b" x="195" y="104">C</text>
    <circle cx="195" cy="150" r="9" fill="#3fa34d"/><text class="b" x="195" y="154">G</text>
    <circle cx="240" cy="100" r="9" fill="#e4572e"/><text class="b" x="240" y="104">A</text>
    <circle cx="240" cy="150" r="9" fill="#2e86ab"/><text class="b" x="240" y="154">T</text>
    <circle cx="285" cy="100" r="9" fill="#3fa34d"/><text class="b" x="285" y="104">G</text>
    <circle cx="285" cy="150" r="9" fill="#f0b429"/><text class="b" x="285" y="154">C</text>
  </g>
  <text class="s" x="30" y="215">• две цепи (двойная спираль)</text>
  <text class="s" x="30" y="240">• сахар — дезоксирибоза</text>
  <text class="s" x="30" y="265">• основания: A, T, G, C</text>
  <text class="s" x="30" y="290">• устойчива, хранит информацию</text>

  <line x1="340" y1="20" x2="340" y2="380" stroke="#d9dee7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- РНК -->
  <text class="h" x="510" y="34" text-anchor="middle">РНК</text>
  <line class="bb" x1="370" y1="80" x2="650" y2="80"/>
  <g stroke-width="3">
    <line x1="400" y1="80" x2="400" y2="115" stroke="#e4572e"/><line x1="445" y1="80" x2="445" y2="115" stroke="#f0b429"/>
    <line x1="490" y1="80" x2="490" y2="115" stroke="#7b5ea7"/><line x1="535" y1="80" x2="535" y2="115" stroke="#3fa34d"/>
    <line x1="580" y1="80" x2="580" y2="115" stroke="#e4572e"/><line x1="625" y1="80" x2="625" y2="115" stroke="#7b5ea7"/>
  </g>
  <g>
    <circle cx="400" cy="125" r="9" fill="#e4572e"/><text class="b" x="400" y="129">A</text>
    <circle cx="445" cy="125" r="9" fill="#f0b429"/><text class="b" x="445" y="129">C</text>
    <circle cx="490" cy="125" r="9" fill="#7b5ea7"/><text class="b" x="490" y="129" style="fill:#fff">U</text>
    <circle cx="535" cy="125" r="9" fill="#3fa34d"/><text class="b" x="535" y="129">G</text>
    <circle cx="580" cy="125" r="9" fill="#e4572e"/><text class="b" x="580" y="129">A</text>
    <circle cx="625" cy="125" r="9" fill="#7b5ea7"/><text class="b" x="625" y="129" style="fill:#fff">U</text>
  </g>
  <text class="s" x="370" y="215">• одна цепь</text>
  <text class="s" x="370" y="240">• сахар — рибоза (лишняя группа –OH)</text>
  <text class="s" x="370" y="265">• основания: A, U, G, C (вместо T — урацил)</text>
  <text class="s" x="370" y="290">• «рабочая копия»: менее стабильна</text>

  <text class="s" x="30" y="350" style="fill:#5b6577">Цвета оснований те же, что на схеме двойной спирали; урацил (U) — фиолетовый.</text>
</svg>
