<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
  <title id="t">Механизм действия биспецифического T-клеточного вовлекателя (BiTE)</title>
  <desc id="d">Биспецифическое антитело состоит из двух scFv-фрагментов на одной цепи: один связывается с опухолевым антигеном (например, CD19), другой — с CD3 на поверхности T-лимфоцита. Сближение имитирует иммунологический синапс, T-клетка активируется без участия HLA и выделяет цитотоксические гранулы, запускающие апоптоз клетки-мишени.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #5b6577; }
    .w { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text class="h" x="20" y="28">Биспецифическое антитело сближает T-клетку и опухолевую клетку</text>

  <!-- tumor cell left -->
  <ellipse cx="200" cy="220" rx="140" ry="110" fill="#fbe1dc" stroke="#d1432f" stroke-width="2.5"/>
  <text class="b" x="200" y="150" text-anchor="middle" style="fill:#c0392b">Опухолевая клетка</text>
  <rect x="290" y="205" width="50" height="20" rx="4" fill="#d1432f"/><text class="w" x="315" y="219">CD19</text>

  <!-- T-cell right -->
  <ellipse cx="700" cy="220" rx="140" ry="110" fill="#dbe4f2" stroke="#3b6fd4" stroke-width="2.5"/>
  <text class="b" x="700" y="150" text-anchor="middle" style="fill:#3b6fd4">T-лимфоцит</text>
  <rect x="560" y="205" width="50" height="20" rx="4" fill="#3b6fd4"/><text class="w" x="585" y="219">CD3</text>

  <!-- bispecific antibody bridging -->
  <path d="M340 215 C400 190 420 190 450 215" fill="none" stroke="#7b5ea7" stroke-width="4"/>
  <path d="M450 215 C480 190 500 190 560 215" fill="none" stroke="#7b5ea7" stroke-width="4"/>
  <circle cx="450" cy="215" r="10" fill="#7b5ea7"/>
  <text class="b" x="450" y="178" text-anchor="middle" style="fill:#5e3f8a">биспецифическое антитело</text>
  <text class="s" x="340" y="248" text-anchor="middle" style="font-size:10.5px">scFv 1</text>
  <text class="s" x="560" y="248" text-anchor="middle" style="font-size:10.5px">scFv 2</text>

  <path d="M450 225 V260" stroke="#5b6577" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text class="s" x="450" y="280" text-anchor="middle">две «руки» одной молекулы связывают обе клетки одновременно</text>

  <!-- granules -->
  <circle cx="640" cy="290" r="9" fill="#e0a43a"/><circle cx="655" cy="305" r="7" fill="#e0a43a"/><circle cx="625" cy="308" r="7" fill="#e0a43a"/>
  <path d="M300 220 L400 220" stroke="#e0a43a" stroke-width="3" stroke-dasharray="3 4" marker-end="url(#ar)"/>
  <text class="s" x="640" y="332" text-anchor="middle" style="font-size:11px">перфорин, гранзимы</text>

  <!-- death of tumor cell marker -->
  <path d="M170 260 l30 30 M200 260 l-30 30" stroke="#c0392b" stroke-width="3"/>
  <text class="s" x="200" y="316" text-anchor="middle" style="fill:#c0392b">апоптоз клетки-мишени</text>

  <line x1="20" y1="360" x2="880" y2="360" stroke="#e1e6ee" stroke-width="2"/>
  <text class="s" x="20" y="386">T-клетка активируется напрямую, без T-клеточного рецептора, HLA и презентации антигена.</text>
  <text class="s" x="20" y="404">Задействуются любые проходящие рядом T-лимфоциты, а не только специфичные к этой опухоли.</text>
  <text class="s" x="20" y="422">Формат BiTE — короткая молекула без Fc-фрагмента; более новые форматы сохраняют Fc и дольше живут в крови.</text>
</svg>
