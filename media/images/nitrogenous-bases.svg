<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="t d">
  <title id="t">Азотистые основания: пурины и пиримидины</title>
  <desc id="d">Структурные формулы азотистых оснований. Пурины (аденин и гуанин) состоят из двух конденсированных колец — шестичленного и пятичленного. Пиримидины (цитозин, тимин и урацил) состоят из одного шестичленного кольца. Показана нумерация атомов колец.</desc>
