    .nm { font-size: 15px; font-weight: 700; }
    .a { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .n { font-size: 10.5px; text-anchor: middle; fill: #8a94a8; }
    .sg { font-size: 12px; text-anchor: middle; fill: #5b6577; font-style: italic; }
    .bd { stroke: #2b3242; stroke-width: 2.3; stroke-linecap: round; fill: none; }
  </style>
