<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d">
  <title id="t">Как вариант из списка отличий превращается в строчку заключения</title>
  <desc id="d">Пять шагов. Список сырых вариантов из файла VCF аннотируют: определяют затронутый ген, тип изменения, частоту в популяционных базах (gnomAD) и наличие в базах патогенности (ClinVar, COSMIC). Затем вариант оценивают по силе доказательств и классифицируют. Для герминальных вариантов используют пятиуровневую шкалу ACMG: патогенный, вероятно патогенный, неопределённого значения (VUS), вероятно доброкачественный, доброкачественный. Для соматических вариантов в опухоли используют четырёхуровневую шкалу AMP/ASCO/CAP по клинической значимости, от первого уровня (сильное значение для диагностики, прогноза или выбора терапии) до четвёртого (неизвестное значение). Итоговое заключение объединяет клинически значимые находки с рекомендациями.</desc>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #5b6577; }
    .w { font-size: 10.5px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .box { fill: #f5f7fb; stroke: #b7c0cf; stroke-width: 1.6; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text class="h" x="20" y="28">От «сырого» варианта — до заключения врачу</text>

  <rect class="box" x="20" y="46" width="200" height="140" rx="10"/>
  <text class="b" x="34" y="68">1. Сырой вариант</text>
  <text class="s" x="34" y="94" style="font-size:10.5px">chr2 25457242 C&gt;T</text>
  <text class="s" x="34" y="112">Файл VCF: тысячи строк —</text>
  <text class="s" x="34" y="128">почти все не имеют значения</text>
  <text class="s" x="34" y="144">(частые варианты нормы).</text>
  <path d="M220 116 H244" stroke="#5b6577" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>

  <rect class="box" x="248" y="46" width="200" height="140" rx="10"/>
  <text class="b" x="262" y="68">2. Аннотация</text>
  <text class="s" x="262" y="90">Ген: <tspan font-style="italic">DNMT3A</tspan>, замена R882H</text>
  <text class="s" x="262" y="108">Частота в gnomAD: 0 %</text>
  <text class="s" x="262" y="126">В ClinVar/COSMIC: описана</text>
  <text class="s" x="262" y="144">много раз при ОМЛ</text>
  <path d="M448 116 H472" stroke="#5b6577" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>

  <rect class="box" x="476" y="46" width="200" height="140" rx="10"/>
  <text class="b" x="490" y="68">3. Оценка доказательств</text>
  <text class="s" x="490" y="90">Функциональные данные,</text>
  <text class="s" x="490" y="106">повторяемость в опухолях,</text>
  <text class="s" x="490" y="122">клинические ассоциации,</text>
  <text class="s" x="490" y="138">рекомендации по терапии.</text>
  <path d="M676 116 H700" stroke="#5b6577" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>

  <rect class="box" x="704" y="46" width="176" height="140" rx="10" style="fill:#eef8f0;stroke:#9ed0a8"/>
  <text class="b" x="718" y="68" style="fill:#2f7d3f">4. Классификация</text>
  <text class="s" x="718" y="94">Присваивается категория</text>
  <text class="s" x="718" y="110">значимости (см. шкалы ниже).</text>

  <line x1="20" y1="210" x2="880" y2="210" stroke="#e1e6ee" stroke-width="2"/>

  <!-- ACMG -->
  <text class="h" x="20" y="238">Герминальные варианты — 5 уровней ACMG</text>
  <rect x="20" y="252" width="164" height="40" fill="#c0392b"/><text class="w" x="102" y="276" style="font-size:11px">Патогенный</text>
  <rect x="184" y="252" width="164" height="40" fill="#e08a6f"/><text class="w" x="266" y="276" style="fill:#1c2330;font-size:10.5px">Вероятно патогенный</text>
  <rect x="348" y="252" width="164" height="40" fill="#e0a43a"/><text class="w" x="430" y="276" style="fill:#1c2330;font-size:10.5px">VUS (неясного значения)</text>
  <rect x="512" y="252" width="164" height="40" fill="#a8cdb0"/><text class="w" x="594" y="276" style="fill:#1c2330;font-size:10.5px">Вероятно доброкачественный</text>
  <rect x="676" y="252" width="184" height="40" fill="#3fa34d"/><text class="w" x="768" y="276" style="font-size:10.5px">Доброкачественный</text>
  <text class="s" x="20" y="310">Используется для наследственных (герминальных) вариантов — например, при подозрении на синдром предрасположенности к лейкозам.</text>

  <!-- AMP/ASCO/CAP -->
  <text class="h" x="20" y="346">Соматические варианты в опухоли — 4 уровня AMP/ASCO/CAP</text>
  <rect x="20" y="360" width="205" height="70" fill="#c0392b" rx="6"/><text class="w" x="122" y="382" style="font-size:12px">Уровень I</text><text class="w" x="122" y="400" style="font-size:9.5px;font-weight:400">сильное значение: диагноз,</text><text class="w" x="122" y="414" style="font-size:9.5px;font-weight:400">прогноз, выбор терапии</text>
  <rect x="235" y="360" width="205" height="70" fill="#e08a6f" rx="6"/><text class="w" x="337" y="382" style="fill:#1c2330;font-size:12px">Уровень II</text><text class="w" x="337" y="400" style="fill:#1c2330;font-size:9.5px;font-weight:400">потенциальное значение</text><text class="w" x="337" y="414" style="fill:#1c2330;font-size:9.5px;font-weight:400">(меньше доказательств)</text>
  <rect x="450" y="360" width="205" height="70" fill="#e0a43a" rx="6"/><text class="w" x="552" y="382" style="fill:#1c2330;font-size:12px">Уровень III</text><text class="w" x="552" y="400" style="fill:#1c2330;font-size:9.5px;font-weight:400">неясное клиническое</text><text class="w" x="552" y="414" style="fill:#1c2330;font-size:9.5px;font-weight:400">значение</text>
  <rect x="665" y="360" width="215" height="70" fill="#b7c0cf" rx="6"/><text class="w" x="772" y="382" style="fill:#1c2330;font-size:12px">Уровень IV</text><text class="w" x="772" y="400" style="fill:#1c2330;font-size:9.5px;font-weight:400">неизвестное значение</text><text class="w" x="772" y="414" style="fill:#1c2330;font-size:9.5px;font-weight:400">(«пассажирский»)</text>
  <text class="s" x="20" y="452">Используется для соматических (приобретённых) мутаций в опухоли — именно эта шкала чаще всего в отчётах по гемобластозам.</text>

  <rect class="box" x="20" y="480" width="860" height="140" rx="10" style="fill:#fff8e8;stroke:#e0a43a"/>
  <text class="b" x="34" y="504">Почему VUS — не диагноз</text>
  <text class="s" x="34" y="526">VUS означает «мы не знаем», а не «есть проблема»: доказательств недостаточно в любую сторону. Со временем накопление данных</text>
  <text class="s" x="34" y="544">может переклассифицировать вариант — поэтому лаборатории периодически пересматривают старые отчёты.</text>
  <text class="s" x="34" y="566">Классификация зависит от контекста: одна и та же замена может быть патогенной соматической мутацией в одной опухоли и</text>
  <text class="s" x="34" y="584">вариантом неясного значения как герминальная находка — шкалы ACMG и AMP/ASCO/CAP отвечают на разные вопросы.</text>
  <text class="s" x="34" y="606" style="font-size:11px">Итоговое заключение — это не просто список вариантов, а интерпретация в контексте клинической картины конкретного пациента.</text>
</svg>
