<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d">
  <title id="t">Структура гена эукариот</title>
  <desc id="d">Схема гена слева направо: энхансер, промотор, 5' нетранслируемая область, три экзона, разделённые двумя интронами, 3' нетранслируемая область и сигнал полиаденилирования. Стрелка показывает направление транскрипции.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1c2330"/></marker></defs>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .c { text-anchor: middle; }
    .w { fill: #fff; font-size: 13px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="760" height="390" fill="#fff"/>
  <text class="h" x="20" y="30">Ген (ДНК) — направление транскрипции →</text>

  <!-- ось ДНК -->
  <line x1="20" y1="120" x2="740" y2="120" stroke="#8b93c9" stroke-width="3"/>

  <!-- энхансер -->
  <rect x="30" y="100" width="50" height="40" rx="6" fill="#f0b429"/>
  <text class="s c" x="55" y="125" style="font-weight:700">энх.</text>
  <path d="M55 100 C55 60 150 60 150 100" fill="none" stroke="#f0b429" stroke-width="2.5" stroke-dasharray="5 4"/>
  <!-- промотор -->
  <rect x="130" y="100" width="80" height="40" rx="6" fill="#e4572e"/>
  <text class="w" x="170" y="125">промотор</text>
  <!-- 5'UTR -->
  <rect x="210" y="105" width="50" height="30" fill="#b7c4e7"/>
  <text class="s c" x="235" y="125">5′-UTR</text>
  <!-- экзон 1 -->
  <rect x="260" y="95" width="70" height="50" fill="#2e6f95"/>
  <text class="w" x="295" y="125">экзон 1</text>
  <!-- интрон 1 -->
  <path d="M330 120 L375 98 L420 120" fill="none" stroke="#5b6577" stroke-width="2.5"/>
  <text class="s c" x="375" y="80" style="fill:#5b6577">интрон 1</text>
  <!-- экзон 2 -->
  <rect x="420" y="95" width="70" height="50" fill="#2e6f95"/>
  <text class="w" x="455" y="125">экзон 2</text>
  <!-- интрон 2 -->
  <path d="M490 120 L535 98 L580 120" fill="none" stroke="#5b6577" stroke-width="2.5"/>
  <text class="s c" x="535" y="80" style="fill:#5b6577">интрон 2</text>
  <!-- экзон 3 -->
  <rect x="580" y="95" width="70" height="50" fill="#2e6f95"/>
  <text class="w" x="615" y="125">экзон 3</text>
  <!-- 3'UTR -->
  <rect x="650" y="105" width="50" height="30" fill="#b7c4e7"/>
  <text class="s c" x="675" y="125">3′-UTR</text>
  <!-- сигнал полиаденилирования -->
  <rect x="700" y="105" width="30" height="30" fill="#3fa34d"/>
  <text class="s c" x="715" y="152" style="fill:#3fa34d">poly(A)</text>

  <!-- транскрипция -->
  <line x1="260" y1="185" x2="700" y2="185" stroke="#1c2330" stroke-width="2.5" marker-end="url(#ar)"/>
  <text class="s c" x="480" y="176">транскрипция: РНК-полимераза считывает всё от начала до конца гена</text>

  <!-- пояснения -->
  <g class="s">
    <rect x="30" y="220" width="16" height="16" fill="#f0b429"/><text x="54" y="233">Энхансер — усиливает транскрипцию, может быть далеко от гена</text>
    <rect x="30" y="246" width="16" height="16" fill="#e4572e"/><text x="54" y="259">Промотор — место сборки РНК-полимеразы и факторов транскрипции</text>
    <rect x="30" y="272" width="16" height="16" fill="#2e6f95"/><text x="54" y="285">Экзоны — остаются в зрелой мРНК (кодируют белок)</text>
    <path d="M30 312 L38 304 L46 312" fill="none" stroke="#5b6577" stroke-width="2.5"/><text x="54" y="312">Интроны — вырезаются при сплайсинге</text>
    <rect x="30" y="330" width="16" height="16" fill="#b7c4e7"/><text x="54" y="343">UTR — нетранслируемые области (регуляция)</text>
    <rect x="30" y="356" width="16" height="16" fill="#3fa34d"/><text x="54" y="369">Сигнал полиаденилирования</text>
  </g>
</svg>
