<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">От гена до зрелой мРНК</title>
  <desc id="d">Ген из трёх экзонов и двух интронов транскрибируется в пре-мРНК. К пре-мРНК добавляются 5' кэп и поли(A) хвост, затем интроны вырезаются, и экзоны сшиваются в зрелую мРНК.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6577"/></marker></defs>
  <style>
    text { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; fill: #1c2330; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #5b6577; }
    .w { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .ex { fill: #2e6f95; }
    .in { fill: #d5dbe6; }
  </style>
  <rect width="760" height="420" fill="#fff"/>

  <!-- 1. ген -->
  <text class="h" x="20" y="34">1. Ген (ДНК)</text>
  <rect class="ex" x="150" y="46" width="90" height="34" rx="4"/><text class="w" x="195" y="68">экзон 1</text>
  <rect class="in" x="240" y="52" width="110" height="22"/><text class="s" x="295" y="68" text-anchor="middle">интрон 1</text>
  <rect class="ex" x="350" y="46" width="90" height="34" rx="4"/><text class="w" x="395" y="68">экзон 2</text>
  <rect class="in" x="440" y="52" width="110" height="22"/><text class="s" x="495" y="68" text-anchor="middle">интрон 2</text>
  <rect class="ex" x="550" y="46" width="90" height="34" rx="4"/><text class="w" x="595" y="68">экзон 3</text>
  <line x1="395" y1="90" x2="395" y2="116" stroke="#5b6577" stroke-width="2" marker-end="url(#ar)"/>
  <text class="s" x="410" y="108">транскрипция (РНК-полимераза II)</text>

  <!-- 2. пре-мРНК -->
  <text class="h" x="20" y="150">2. Пре-мРНК</text>
  <rect class="ex" x="150" y="130" width="90" height="34" rx="4"/><text class="w" x="195" y="152">экзон 1</text>
  <rect class="in" x="240" y="136" width="110" height="22"/><text class="s" x="295" y="152" text-anchor="middle">интрон 1</text>
  <rect class="ex" x="350" y="130" width="90" height="34" rx="4"/><text class="w" x="395" y="152">экзон 2</text>
  <rect class="in" x="440" y="136" width="110" height="22"/><text class="s" x="495" y="152" text-anchor="middle">интрон 2</text>
  <rect class="ex" x="550" y="130" width="90" height="34" rx="4"/><text class="w" x="595" y="152">экзон 3</text>
  <line x1="395" y1="174" x2="395" y2="200" stroke="#5b6577" stroke-width="2" marker-end="url(#ar)"/>
  <text class="s" x="410" y="192">кэпирование и полиаденилирование</text>

  <!-- 3. с кэпом и хвостом -->
  <text class="h" x="20" y="226">3. Кэп</text><text class="h" x="20" y="243">и хвост</text>
  <circle cx="130" cy="230" r="11" fill="#ee8a2b"/><text class="s" x="130" y="258" text-anchor="middle">5′-кэп</text>
  <rect class="ex" x="150" y="214" width="90" height="34" rx="4"/><text class="w" x="195" y="236">экзон 1</text>
  <rect class="in" x="240" y="220" width="110" height="22"/>
  <rect class="ex" x="350" y="214" width="90" height="34" rx="4"/><text class="w" x="395" y="236">экзон 2</text>
  <rect class="in" x="440" y="220" width="110" height="22"/>
  <rect class="ex" x="550" y="214" width="90" height="34" rx="4"/><text class="w" x="595" y="236">экзон 3</text>
  <rect x="640" y="222" width="70" height="18" rx="4" fill="#3fa34d"/><text class="w" x="675" y="235">AAAAAA</text>
  <text class="s" x="675" y="258" text-anchor="middle">поли(А)-хвост</text>
  <path d="M295 253 C295 286 395 286 395 253" fill="none" stroke="#5b6577" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M495 253 C495 286 595 286 595 253" fill="none" stroke="#5b6577" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="s" x="345" y="284" text-anchor="middle">интроны вырезаются</text>
  <text class="s" x="545" y="284" text-anchor="middle">(сплайсинг)</text>
  <line x1="395" y1="296" x2="395" y2="322" stroke="#5b6577" stroke-width="2" marker-end="url(#ar)"/>
  <text class="s" x="410" y="314">экзоны сшиваются</text>

  <!-- 4. зрелая мРНК -->
  <text class="h" x="20" y="358">4. Зрелая мРНК</text>
  <circle cx="200" cy="352" r="11" fill="#ee8a2b"/>
  <rect class="ex" x="220" y="336" width="80" height="34" rx="4"/><text class="w" x="260" y="358">экзон 1</text>
  <rect class="ex" x="300" y="336" width="80" height="34" rx="4"/><text class="w" x="340" y="358">экзон 2</text>
  <rect class="ex" x="380" y="336" width="80" height="34" rx="4"/><text class="w" x="420" y="358">экзон 3</text>
  <rect x="460" y="344" width="70" height="18" rx="4" fill="#3fa34d"/><text class="w" x="495" y="357">AAAAAA</text>
  <text class="s" x="560" y="357">→ выход в цитоплазму на трансляцию</text>
  <text class="s" x="20" y="404">Схема упрощена: в реальных генах экзонов много, а интроны часто в десятки раз длиннее экзонов.</text>
</svg>
